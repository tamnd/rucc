name: Bug
description: A crash, a wrong diagnostic, a rejected valid program, or anything else that is not a miscompilation.
title: "bug: "
labels: ["kind/bug"]
body:
  - type: markdown
    attributes:
      value: |
        If the compiler produced code that does the wrong thing, please use the miscompilation template instead. That one gets handled differently and faster.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the full output, including any diagnostics, rather than a summary of it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The source and the exact command. A reduced case is worth a lot.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and target
      description: The output of `rucc --version` and `rucc --print-config`.
    validations:
      required: true
