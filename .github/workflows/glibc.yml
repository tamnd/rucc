# The glibc header check of milestone #3281. glibc picks code in its headers by the compiler that
# reads them, so a new glibc release or a change in what rucc says it is can break a header that
# compiled before. This builds glibc with GCC and compiles each installed header with rucc, under
# each standard and feature test macro glibc supports.
#
# A glibc build takes most of an hour on a runner, and glibc changes slowly, so this runs once a
# week and when asked.

name: glibc

on:
  schedule:
    # Sunday, two hours after the nightly tier.
    - cron: "0 5 * * 0"
  workflow_dispatch:

concurrency:
  group: glibc
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  headers:
    name: glibc installed headers with rucc
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GLIBC_VERSION: "2.42"
      GLIBC_SHA256: d1775e32e4628e64ef930f435b67bb63af7599acb6be2b335b9f19f16509f17f
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
      - name: build rucc
        run: cargo build --release --bin rucc
      - name: install what the glibc build needs
        run: sudo apt-get install -y --no-install-recommends bison gawk
      - name: fetch glibc
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o glibc.tar.xz "https://ftp.gnu.org/gnu/glibc/glibc-$GLIBC_VERSION.tar.xz"
          echo "$GLIBC_SHA256  glibc.tar.xz" | sha256sum -c -
          tar xJf glibc.tar.xz
      - name: run the header tests
        run: |
          set -o pipefail
          WORK="$RUNNER_TEMP/build" tests/tools/glibc-headers.sh target/release/rucc "$RUNNER_TEMP/glibc-$GLIBC_VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: keep what the tests said
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: glibc-headers
          path: |
            ${{ runner.temp }}/build/*.log
            ${{ runner.temp }}/build/*/check-installed-headers-c.out
          if-no-files-found: ignore
