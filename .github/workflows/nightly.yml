# The nightly tier from spec/15-testing.md section 15.7.
#
# Everything here is too slow or too flaky-by-nature to gate a merge, and all of it is the
# kind of check that finds a problem days before a user would. At M0 the list is short,
# because most of what belongs here needs a compiler that compiles C. It grows with the
# milestones, and the placeholders are named rather than left implicit so that the gap is
# visible.

name: nightly

on:
  schedule:
    # 03:00 UTC. Late enough that a day's commits are all in, early enough that the results
    # are waiting in the morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  sanitizers:
    name: ${{ matrix.san }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        san: [address, thread]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install nightly
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: san-${{ matrix.san }}
      # The compiler manipulates arena indices and does its own bit packing, and its unsafe
      # lives in the arenas and the memory-mapped source handling. spec/15-testing.md section
      # 15.6 puts the sanitizers on ourselves, not only on the code we generate.
      - name: cargo test under -Zsanitizer=${{ matrix.san }}
        env:
          RUSTFLAGS: -Zsanitizer=${{ matrix.san }}
          RUSTDOCFLAGS: -Zsanitizer=${{ matrix.san }}
        run: |
          cargo +nightly test --workspace --all-features \
            -Zbuild-std --target x86_64-unknown-linux-gnu

  miri:
    name: miri
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install nightly with miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: miri
      # Unit tests only. The integration tests spawn the compiler binary and read the case
      # directories off disk, and Miri can do neither, so under it they fail on the first
      # `opendir` rather than checking anything. The unsafe this job exists for is all in
      # the libraries anyway.
      #
      # Miri is slow enough that it will stop being able to run even this at some point.
      # When that happens the answer is to select the crates whose unsafe justifies it,
      # not to drop the job.
      - run: cargo +nightly miri test --workspace --lib
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  advisories:
    name: advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.87.2
        with:
          tool: cargo-deny
      # The per-commit job checks the advisory database as it stood when the commit landed.
      # This one catches an advisory published after the fact, which is the case that matters
      # for a dependency we have already shipped.
      - run: cargo deny --all-features check advisories bans

  cost:
    name: what the monitor costs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: cost
      - name: install the target library
        run: rustup target add x86_64-unknown-linux-gnu
      # This runner is the machine the programs are compiled for, so they run on it directly and
      # the numbers mean something. On a developer machine they run under emulation, which moves
      # the cost of a cache miss relative to the cost of an instruction and makes the ratio
      # meaningless, so this log is where the S1 baseline comes from. See bench/README.md.
      #
      # It is here rather than in the per-commit job because a timing on a shared runner is noisy
      # enough that gating a merge on it would fail merges for reasons that have nothing to do
      # with the merge. What this catches is a change of shape over days, which is what it is for.
      - name: time bench/safety with the monitor off and on
        run: cargo xtask cost

  # PostgreSQL 18.6 built by rucc at -O2 with assertions on, and its regression and isolation
  # suites run against it. This is the cassert nightly of PG2 in tamnd/rucc#1989. It is ungraded:
  # an assertion failure here is something to read in the morning rather than a red nightly, so
  # the suites may fail without failing the job, and what they said goes in the run summary and
  # the artifacts either way. The per commit job in ci.yml is the graded one.
  postgres-cassert:
    name: postgres with assertions at -O2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PG_VERSION: "18.6"
      PG_SHA256: 555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build rucc
        run: cargo build --release --bin rucc
      - name: fetch postgres
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o pg.tar.bz2 "https://ftp.postgresql.org/pub/source/v$PG_VERSION/postgresql-$PG_VERSION.tar.bz2"
          echo "$PG_SHA256  pg.tar.bz2" | sha256sum -c -
          tar xjf pg.tar.bz2
      - name: configure
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/postgresql-$PG_VERSION"
          ./configure CC="$GITHUB_WORKSPACE/target/release/rucc" CFLAGS=-O2 \
            --without-icu --without-readline --without-zlib --without-llvm \
            --disable-nls --enable-cassert --enable-debug
      - name: build
        run: make -C "$RUNNER_TEMP/postgresql-$PG_VERSION" -j"$(nproc)" -s
      - name: run the suites
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/postgresql-$PG_VERSION"
          for suite in src/test/regress src/test/isolation; do
            make -C "$suite" check > "$RUNNER_TEMP/$(basename "$suite").log" 2>&1
            status=$?
            summary=$(grep -E '^# (All [0-9]+ tests passed|[0-9]+ of [0-9]+ tests failed)' "$RUNNER_TEMP/$(basename "$suite").log" | tail -1)
            echo "$suite: exit $status, ${summary:-no summary line}" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          grep -h "TRAP:" src/test/*/log/postmaster.log src/test/*/output_iso/log/postmaster.log 2>/dev/null \
            | sort | uniq -c | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: keep what the suites said
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: postgres-cassert
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/postgresql-${{ env.PG_VERSION }}/src/test/regress/regression.diffs
            ${{ runner.temp }}/postgresql-${{ env.PG_VERSION }}/src/test/regress/log/
            ${{ runner.temp }}/postgresql-${{ env.PG_VERSION }}/src/test/isolation/output_iso/regression.diffs
            ${{ runner.temp }}/postgresql-${{ env.PG_VERSION }}/src/test/isolation/output_iso/log/
          if-no-files-found: ignore

  # Rung 1 for x86_64-windows-gnu, which is what keeps that row at tier 2: SQLite's veryquick
  # suite from a testfixture rucc built, run under Wine, held against the same suite from a
  # testfixture MinGW GCC built. It fails on a test that fails only in rucc's build.
  sqlite-windows:
    name: sqlite for x86_64-windows-gnu under wine
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install lld 19, wine, MinGW GCC and tclsh
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y lld-19 wine64 gcc-mingw-w64-x86-64 tcl8.6
      - name: build rucc, the sysroot and the runtime
        run: |
          cargo build --release --bin rucc
          ./target/release/rucc --fetch x86_64-windows-gnu
          cargo xtask builtins --target x86_64-windows-gnu
      - name: build and run the suite both ways
        run: |
          export PATH="/usr/lib/wine:$PATH"
          tests/sqlite/windows.sh "$PWD/target/release/rucc" "$RUNNER_TEMP/sqlite-windows" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: keep what the suites said
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: sqlite-windows
          path: |
            ${{ runner.temp }}/sqlite-windows/*/suite.log
            ${{ runner.temp }}/sqlite-windows/*/test-out.txt
            ${{ runner.temp }}/sqlite-windows/*/failures.txt
          if-no-files-found: ignore

  # Named so the gap is visible rather than implicit. Each of these turns into a real job at
  # the milestone that makes it possible, per spec/15-testing.md section 15.7.
  planned:
    name: what belongs here and does not exist yet
    runs-on: ubuntu-24.04
    steps:
      - name: the list
        run: |
          cat <<'EOF'
          rungs 2 and 3 of the target ladder, all optimization levels        M7, M9
          an eight-hour randomized differential run, Csmith and YARPGen      M5
          the full GCC torture suite                                        M3
          the DWARF differential against GDB and LLDB                       M8
          the ABI differential against GCC                                  M6
          the code quality suite, published to the tracking dashboard       M4
          EOF
