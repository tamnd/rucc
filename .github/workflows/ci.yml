# The per-commit gate. Everything here is required to merge.
#
# The matrix is the first three rows of the table in spec/15-testing.md section 15.7. The
# cross-compilation and QEMU rows arrive with the second target in M6.
#
# Actions are pinned to a patch version rather than a major tag. A major tag is a moving
# reference, and a compiler project that cannot reproduce its own CI run has given up
# something it needs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A force-push should cancel the run it replaced. The default branch is exempt, because a
# main-branch run is what the badge and the bisect history read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Cheapest checks first, so a formatting mistake costs seconds rather than a full matrix.
  quick:
    name: format, lints and house rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      # Before the rest, because a path Windows will not write fails the checkout of the Windows
      # job rather than a test in it, and a job that never got a working tree cannot say why.
      - name: checkable paths
        run: cargo xtask paths
      - name: layer rule
        run: cargo xtask layers
      - name: prose style
        run: cargo xtask style
      - name: malformed forms list
        run: cargo xtask malformed
      - name: target table
        run: cargo xtask targets --check
      # The recorded cross link lines. Here rather than in the test matrix because it needs no
      # toolchain and no target machine, and because a loader path or an emulation name that changed
      # by accident is something a reviewer should see in the diff of this job rather than in a
      # binary that will not start on somebody else's machine.
      - name: recorded link lines
        run: cargo xtask link-lines --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    # Runner images are named explicitly rather than through `-latest`, so that an image
    # rollout shows up as a commit rather than as yesterday's green run turning red. The
    # policy is the newest generally available image per host: Ubuntu 26.04 exists but is
    # still marked preview, so Linux stays on 24.04 until it is not.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64, debug
            os: ubuntu-24.04
            profile: dev
          - name: linux x86-64, release
            os: ubuntu-24.04
            profile: release
          - name: macos arm64
            os: macos-26
            profile: dev
          - name: windows x86-64
            os: windows-2025
            profile: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.profile }}
      - name: cargo build
        run: cargo build --workspace --all-features --profile ${{ matrix.profile }}
      # Every test binary runs even after one fails, so a run shows all that is broken on a host
      # rather than the first of it.
      - name: cargo test
        run: cargo test --workspace --all-features --profile ${{ matrix.profile }} --no-fail-fast
      # The M0 exit criterion in spec/17-milestones.md is that this works and is correct on
      # all three hosts, so it is checked rather than assumed.
      - name: rucc --print-config
        shell: bash
        run: |
          set -euo pipefail
          dir=${{ matrix.profile == 'dev' && 'debug' || 'release' }}
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          "./target/$dir/rucc$exe" --print-config
          "./target/$dir/rucc$exe" --version
      # The litmus tests on Apple silicon, which reorders more than most AArch64 parts do and so is
      # where a missing barrier shows soonest. Here rather than in a job of its own because the
      # compiler is already built.
      - name: litmus tests
        if: matrix.name == 'macos arm64'
        run: tests/litmus/run.sh "$PWD/target/debug/rucc" cc

  docs:
    name: documentation
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # Every crate is published, so every crate's documentation has to build. A broken
      # intra-doc link is a broken link on docs.rs.
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps

  solver:
    name: rule verification
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # The release from upstream rather than the one in the distribution, which is four years
      # old here and does not know the name of the logic a question about arrays and floats at
      # once is asked in. It answers such a question anyway, after saying it ignored the logic,
      # and an answer from a solver that ignored what it was asked in is not one to count.
      - name: a solver to discharge the rules against
        run: |
          set -euo pipefail
          version=5.1.0
          build=z3-$version-x64-glibc-2.39
          curl -fsSL -o z3.zip \
            "https://github.com/Z3Prover/z3/releases/download/z3-$version/$build.zip"
          unzip -q z3.zip
          sudo install -m 755 "$build/bin/z3" /usr/local/bin/z3
          z3 --version
      # The verification tests skip themselves when no solver is on PATH, so that a machine
      # without one still runs everything else. That is the right default and the wrong thing
      # to rely on in CI, where a solver that failed to install would turn into a silent gap
      # rather than a red run. This job is the one place the skip is an error.
      - name: cargo test
        env:
          RUCC_REQUIRE_SOLVER: "1"
        run: cargo test -p rucc-verify --all-features
      # The gate itself, over every rule file in the tree. It stood before there was a rule set
      # to gate, so the rules landed into it rather than after it, and it is what keeps the next
      # rule from being the first unproved one.
      # One run over all the directories rather than one per directory, because --report writes a
      # single list over everything it was shown and a run that saw half the tree would report
      # the other half as having left the list.
      - name: no rule enters the rule set unverified
        run: |
          cargo run -q -p rucc-verify -- \
            crates/rucc-codegen/rules crates/rucc-opt/rules crates/rucc-wasm/rules \
            --report docs/UNVERIFIED.md --check
      # The other half of coverage, which asks a different question and needs no solver: not
      # whether each rule is right but whether there is a rule at all. spec/15-testing.md section
      # 15.8 keeps the count of IR opcodes with no lowering, so it is printed here rather than
      # asserted in a test whose output nobody sees.
      - name: every IR opcode has somewhere to go
        run: cargo test -p rucc-codegen --lib coverage::tests -- --nocapture

  msrv:
    name: minimum supported rust version
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: read the floor from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: install
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
      # A compiler that needs last week's stable Rust is a compiler people cannot use on the
      # systems where they need it, per spec/18-package-layout.md section 18.6. The floor is
      # raised deliberately, in a commit, not by accident in a dependency bump.
      - name: cargo check
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features

  determinism:
    name: reproducible output
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # spec/02-the-goal.md makes byte-identical output a requirement, and there are two halves
      # to it. The tree's own artefacts have to build twice to the same bytes, which is what the
      # first step asks, and what the compiler makes out of a C file has to be the same in every
      # run, which is what the second one asks. The second half is the one that catches hash
      # order, and it needs several processes to catch it: Rust gives each run its own hash seed,
      # so a difference that depends on the seed does not show up inside one run.
      - name: build twice and compare
        run: |
          set -euo pipefail
          cargo build --release --bin rucc
          sha256sum target/release/rucc > first.sha256
          rm -rf target/release/rucc target/release/.fingerprint
          cargo build --release --bin rucc
          sha256sum target/release/rucc > second.sha256
          diff <(cut -d' ' -f1 first.sha256) <(cut -d' ' -f1 second.sha256)
          echo "the compiler builds reproducibly"
      - name: compile the same program several times over
        run: cargo xtask repeatable
        env:
          RUCC_XTASK_COMPILER: ${{ github.workspace }}/target/release/rucc

  # spec/11-asm-objects-debug.md section 11.1 says every instruction we encode is read back by a
  # decoder that has never seen our table. An encoding bug is silent, survives every test that
  # does not run the program, and costs a day to find from the far end, so it is caught here.
  disasm:
    name: differential disassembly
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # The refresh is allowed to fail and the install is not. The runner image carries third
      # party apt sources this job has no use for, and one of them serving an index that does not
      # match its hashes makes `apt-get update` exit non-zero after it has already refreshed
      # everything else. That took this job down on every pull request at once on 2026-09-09, for
      # a reason that had nothing to do with the compiler or with llvm. What the job actually
      # needs is llvm-mc, so that is what is checked, by the install below and by `cargo xtask
      # disasm` refusing to run without it.
      - name: install the decoder
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y llvm
          llvm-mc --version | head -1
      - name: read back every instruction we encode
        run: cargo xtask disasm

  # spec/12-abi-and-runtime.md section 12.8 asks for the runtime support routines to be held against
  # a reference rather than against expectations written beside them, and the Rust crate in
  # runtime/rucc-builtins is kept for that. This is the job where the two meet: one harness compiled
  # twice, linked against the archive rucc wrote out of runtime/builtins and against the same
  # routines built from Rust, and every group of cases has to come out the same on both sides.
  #
  # It is also the job that holds the archive to being buildable at all, which is the bootstrapping
  # property of that section: an archive that does not build is a code generator that does not work.
  builtins:
    name: the runtime held against its reference
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # The reference is compiled for the target rather than for the host, so the standard library
      # for that target has to be there even though it is the same machine. The archive under test
      # needs nothing installed, which is the whole point of it being C this compiler builds.
      - name: install the target library
        run: rustup target add x86_64-unknown-linux-gnu
      - name: run the same cases against both
        run: cargo xtask builtins-diff

  # The job above is about the routines a 128-bit division calls. This one is about the code that
  # calls them, and about everything else at that width: the pass in crates/rucc-codegen/src/wide.rs
  # had nothing but its own tests reading its own output behind it, and no program compiled by it had
  # ever been run. So the same fixture is compiled by this compiler at three optimization levels and
  # by gcc, all four are run, and every group of cases has to come out the same.
  #
  # Three levels because the one bug this pass has had was an optimization level apart: at -O0 the
  # order a function holds its blocks in is the order they run in, and above -O0 it is not.
  wide:
    name: 128-bit arithmetic held against gcc
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: run the same arithmetic both ways
        run: cargo xtask wide

  # A division by a constant becomes a multiply by a magic number and some shifts, and a wrong shift
  # is a wrong answer for some dividends and not others. The pass's own tests prove the plan it makes
  # over every eight bit dividend and every sixteen bit divisor. This runs the code that came out, at
  # every width, against gcc.
  divide:
    name: divisions by a constant held against gcc
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: run the same divisions both ways
        run: cargo xtask divide

  # A call in tail position becomes the epilogue and a jump at -O2, and a jump that leaves an
  # argument or the answer in the wrong register is a wrong answer only when it runs. This runs every
  # shape against gcc, and a chain of ten million of them in a one megabyte stack.
  tail:
    name: calls in tail position held against gcc
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: run the same calls both ways
        run: cargo xtask tail

  # spec/cross-compile/09-libc-stubs.md section 9.8 wants the stub writer's output checked by
  # something that does not share its beliefs. The round trip test in the crate does not qualify,
  # because whoever wrote the writer wrote the reader: both thought a .hash entry was four bytes on
  # every architecture, they agreed with each other, and 64-bit s390 uses eight. Two readers run
  # here because they disagree about exactly that field, and the one llvm will not parse is the one
  # binutils gets right.
  stubs:
    name: stubs read by somebody else
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # GNU readelf is already on the image as part of binutils. llvm-readelf is not, and the
      # refresh is allowed to fail for the reason the disasm job above explains at length. What
      # matters is that both readers are present before the check runs, because `cargo xtask stubs`
      # runs with either one and is worth much less with only one.
      - name: install the second reader
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y llvm binutils
          readelf --version | head -1
          llvm-readelf --version | head -2
          ar --version | head -1
      - name: read every library back with a reader we did not write
        run: cargo xtask stubs

  # The same argument as the stubs job and a harsher test, because a Windows import library has no
  # slack in it. There is no useful specification for the file, so the writer was built by reading
  # what llvm-dlltool produces, and the check is that it still produces the same bytes. Two of the
  # three rules the writer follows were found by this comparison failing, and neither is written
  # down anywhere.
  implib:
    name: import libraries held against dlltool
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # llvm-20 by name rather than the `llvm` the jobs above install, because that one is llvm 18 on
      # this image and llvm 18 writes a different import library from every llvm since: the handling
      # of a .def rename was rewritten for ARM64EC in 19. The check refuses an older tool rather than
      # compare against it, so this job would fail with 18 installed and nothing else. Ubuntu 24.04
      # carries 19 and 20 in its own archive, which is why this needs no third party apt source.
      # The refresh is allowed to fail for the reason the disasm job above explains at length.
      #
      # The usage message is printed rather than a version, because llvm-dlltool has no --version at
      # all and its list of machines is what the check reads to decide whether it is new enough. GNU
      # dlltool is on the image already and is deliberately not what this compares against, since it
      # writes a different file on purpose.
      - name: install the reference writer
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y llvm-20
          /usr/lib/llvm-20/bin/llvm-dlltool 2>&1 | tail -1
      - name: write every import library both ways and compare the bytes
        run: cargo xtask implib

  # The Windows programs in tests/exec/windows, cross compiled here and run under Wine, so that a
  # change which breaks what a Windows program needs at run time shows up on every pull request
  # and does not wait for the Windows runner. lld 19 is the oldest lld the driver accepts for a
  # windows-gnu link, and it is left off PATH because finding it is part of what users rely on.
  # The first program Wine starts creates its prefix, which is the slow part of this job.
  wine:
    name: windows programs under wine
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install lld 19, wine and MinGW GCC
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y lld-19 wine64 gcc-mingw-w64-x86-64
          /usr/lib/wine/wine64 --version
          x86_64-w64-mingw32-gcc --version | head -1
      - name: build rucc, the sysroot and the runtime
        run: |
          cargo build --release --bin rucc
          ./target/release/rucc --fetch x86_64-windows-gnu
          cargo xtask builtins --target x86_64-windows-gnu
      - name: run tests/exec/windows
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wine
        run: tests/exec/windows/run.sh "$PWD/target/release/rucc --target=x86_64-windows-gnu" /usr/lib/wine/wine64
      # __builtin_setjmp in one compiler's half of a program and __builtin_longjmp in the other's,
      # both ways round, which is how Postgres's server and its extensions meet on MinGW-w64.
      - name: the builtin setjmp pair across rucc and MinGW GCC
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wine
        run: tests/exec/across/run.sh "$PWD/target/release/rucc --target=x86_64-windows-gnu" x86_64-w64-mingw32-gcc /usr/lib/wine/wine64
      # Layer 6 of spec/cross-compile/14-testing.md for this row: the signature corpus with rucc
      # on one side of every call and MinGW GCC on the other, both ways round, run under Wine.
      - name: the differential abi against MinGW GCC
        env:
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wine
        run: cargo xtask abi-differential --target x86_64-windows-gnu
      - name: hash the objects
        run: tests/exec/windows/objects.sh "$PWD/target/release/rucc --target=x86_64-windows-gnu" > objects-linux.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: objects-linux
          path: objects-linux.txt
          retention-days: 7

  # The same programs for aarch64-windows-gnu, under the Wine that Ubuntu builds for arm64, which
  # runs an AArch64 Windows program directly with nothing emulated. This is the gate the native job
  # below is held to as well, and it comes first because it needs no Windows machine. The x18 check
  # reads what rucc writes for every program here and fails on any instruction that writes the
  # register the TEB lives in.
  wine-arm:
    name: aarch64 windows programs under wine
    needs: quick
    runs-on: ubuntu-24.04-arm
    # Wine 9.0 from Ubuntu 24.04 is built with return address signing, and its unwinder does not
    # know the CFA opcode that says so, so the first exception in wineboot unwinds forever. Debian
    # 13's Wine 10.0 knows it.
    container: debian:trixie
    # The container runs as root with HOME pointing elsewhere, which rustup and Wine both refuse,
    # so the toolchain and the prefix are in places root owns.
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
      WINEPREFIX: /root/wine
    steps:
      - name: install a toolchain, lld 19 and wine
        run: |
          apt-get update
          apt-get install -y build-essential ca-certificates curl git lld-19 wine64
          /usr/lib/wine/wine64 --version
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # Made here with a limit on it, so that a prefix that does not come up says so in its own
      # step rather than as the first program never finishing. Mono and Gecko are left out, since
      # nothing here needs them and asking for them is what waits on a dialog.
      - name: make the wine prefix
        env:
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          timeout -k 10 600 /usr/lib/wine/wine64 wineboot --init
          timeout -k 10 300 /usr/lib/wine/wineserver64 -w
      - name: build rucc, the sysroot and the runtime
        run: |
          cargo build --release --bin rucc
          ./target/release/rucc --fetch aarch64-windows-gnu
          cargo xtask builtins --target aarch64-windows-gnu
      - name: nothing writes x18
        run: tests/exec/windows/x18.sh "$PWD/target/release/rucc --target=aarch64-windows-gnu"
      - name: run tests/exec/windows
        # Run even when the x18 check fails, since the two say different things.
        if: ${{ !cancelled() }}
        env:
          WINEDEBUG: -all
        run: tests/exec/windows/run.sh "$PWD/target/release/rucc --target=aarch64-windows-gnu" /usr/lib/wine/wine64

  # The aarch64 row of the matrix in spec/15-testing.md section 15.7: cross compiled on this
  # machine and run under qemu user mode. The programs are the ones held against gcc above, built
  # by gcc for aarch64 as the reference and run under the same emulator, and rucc links them as
  # well as compiling them, against the Debian cross packages the driver finds under /usr/<triple>.
  qemu:
    name: aarch64 programs under qemu
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install the cross packages, lld and qemu
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user lld-19
          qemu-aarch64 --version | head -1
          aarch64-linux-gnu-gcc --version | head -1
      - name: build rucc and the runtime for aarch64
        run: |
          cargo build --release --bin rucc
          cargo xtask builtins --target aarch64-linux-gnu
      - name: run the programs
        run: tests/qemu/run.sh "$PWD/target/release/rucc" aarch64-linux-gnu

  # Rung 0 for i686-linux-gnu. An x86_64 Linux kernel runs 32-bit programs directly, so nothing is
  # emulated here: rucc builds the c-testsuite programs against Ubuntu's i386 cross libc and they
  # run on the runner itself, with the exclusions in tests/rung0/exclude-i686-linux-gnu.txt.
  i686:
    name: i686 linux rung 0
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install the i386 libc and lld
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y gcc-i686-linux-gnu libc6-dev-i386-cross libc6-i386 lib32gcc-s1 lld-19
      - name: build rucc
        run: cargo build --release --bin rucc
      - name: run rung 0
        run: tests/rung0/run.sh "$PWD/target/release/rucc" i686-linux-gnu

  # rucc built as a WebAssembly module is the same compiler, so it writes the same bytes (#2862).
  # Rung 0 is compiled by native rucc and by rucc.wasm in Wasmtime, at -O0 and -O2, and every
  # object is compared byte for byte. Nothing is linked, because a wasm module cannot start a
  # linker.
  rucc-as-wasm:
    name: rucc as a wasm module
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install the wasm32-wasip1 target and Wasmtime
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip1
          curl -sSfL -o wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.1/wasmtime-v49.0.1-x86_64-linux.tar.xz
          echo "c71f7e0d30a92e418f0d17db7c6d8f6664c1ad764340a1278678f4209deab534  wasmtime.tar.xz" | sha256sum -c -
          tar -xJf wasmtime.tar.xz
          echo "$PWD/wasmtime-v49.0.1-x86_64-linux" >> "$GITHUB_PATH"
      - name: build rucc, native and as a module
        run: |
          cargo build --release --bin rucc
          cargo build --release --bin rucc --target wasm32-wasip1
      - name: fetch the x86_64-linux-musl sysroot
        run: ./target/release/rucc --fetch x86_64-linux-musl
      - name: compare the objects
        run: tests/rucc-as-wasm/run.sh "$PWD/target/release/rucc" "$PWD/target/wasm32-wasip1/release/rucc.wasm" x86_64-linux-musl

  # Rung 0 for wasm32-wasip1 (#2864). rucc compiles the c-testsuite programs to wasm modules and
  # links them with wasm-ld from lld 21 against the wasi-libc that `rucc --fetch` installs. The
  # programs run under Wasmtime and then under the WASI of Node, through tests/rung0/wasi.mjs. In
  # the Wasmtime run, `wasm-tools validate` checks each object and each module that rucc writes.
  # 00187 writes a file and reads it back, so both engines give the program the working directory.
  wasm:
    name: wasm32-wasip1 rung 0
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: install lld, Wasmtime and wasm-tools
        run: |
          set -euo pipefail
          sudo .github/install-lld-wasi.sh
          curl -sSfL -o wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.1/wasmtime-v49.0.1-x86_64-linux.tar.xz
          echo "c71f7e0d30a92e418f0d17db7c6d8f6664c1ad764340a1278678f4209deab534  wasmtime.tar.xz" | sha256sum -c -
          tar -xJf wasmtime.tar.xz
          echo "$PWD/wasmtime-v49.0.1-x86_64-linux" >> "$GITHUB_PATH"
          curl -sSfL -o wasm-tools.tar.gz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.261.0/wasm-tools-1.261.0-x86_64-linux.tar.gz
          echo "ad62b2176037e93e1348cb65d6212d128ca9f097b63d155569f25215818ff7b1  wasm-tools.tar.gz" | sha256sum -c -
          tar -xzf wasm-tools.tar.gz
          echo "$PWD/wasm-tools-1.261.0-x86_64-linux" >> "$GITHUB_PATH"
      - name: build rucc and the runtime for wasm32-wasip1
        run: |
          cargo build --release --bin rucc
          cargo xtask builtins --target wasm32-wasip1
          ./target/release/rucc --fetch wasm32-wasip1
      - name: run rung 0 under Wasmtime
        env:
          RUNNER: wasmtime run --dir=.
          VALIDATE: wasm-tools validate
        run: tests/rung0/run.sh "$PWD/target/release/rucc" wasm32-wasip1
      - name: run rung 0 under Node
        env:
          RUNNER: node ${{ github.workspace }}/tests/rung0/wasi.mjs
        run: tests/rung0/run.sh "$PWD/target/release/rucc" wasm32-wasip1

  # The barriers and atomics PostgreSQL is built on, run on AArch64 hardware. The qemu job above
  # cannot do this, because an emulated machine is only ever as weak as the x86 host under it, and
  # most of what AArch64 is allowed to reorder x86 never does. Each litmus test in tests/litmus runs
  # a few million times and fails on an outcome the memory model forbids, built by rucc at -O0 and
  # -O2 and by gcc with and without its outline atomics as the control.
  litmus:
    name: aarch64 litmus tests on hardware
    needs: quick
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install lld
        run: |
          sudo apt-get update || echo "at least one apt source is unhappy, carrying on"
          sudo apt-get install -y lld-19
          gcc --version | head -1
          lscpu | grep -i -m2 "model name\|vendor"
          nproc
      - name: build rucc and the runtime
        run: |
          cargo build --release --bin rucc
          cargo xtask builtins --target aarch64-linux-gnu
      - name: run the litmus tests
        run: tests/litmus/run.sh "$PWD/target/release/rucc" gcc

  # The same programs built by rucc on Windows itself, with no flags, since x86_64-windows-gnu is
  # the default target there. lld is the one in the LLVM install the image carries, which the
  # driver finds on PATH or under %ProgramFiles%\LLVM\bin. MinGW GCC from MSYS2 then
  # runs the same programs, as a check that the expected output is still what gcc says on a
  # real Windows machine and not only under Wine.
  windows:
    name: windows programs on windows
    needs: quick
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build rucc, the sysroot and the runtime
        run: |
          cargo build --release --bin rucc
          ./target/release/rucc.exe --fetch x86_64-windows-gnu
          cargo xtask builtins --target x86_64-windows-gnu
      - name: run tests/exec/windows with rucc
        run: tests/exec/windows/run.sh "$PWD/target/release/rucc.exe"
      - name: hash the objects
        run: tests/exec/windows/objects.sh "$PWD/target/release/rucc.exe" > objects-windows.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: objects-windows
          path: objects-windows.txt
          retention-days: 7
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: run tests/exec/windows with MinGW GCC
        shell: msys2 {0}
        run: tests/exec/windows/run.sh gcc
      # The same differential the wine job runs, with nothing between the programs and Windows.
      # MSYS2's gcc is named outright, and its bin directory goes on the end of PATH rather than
      # the front, because the compiler's own programs load their DLLs from there and nothing in it
      # should stand in for what the runner already has.
      - name: the differential abi against MinGW GCC
        env:
          RUCC_ABI_CC: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\gcc.exe
        run: |
          PATH="$PATH:$(cygpath -u '${{ steps.msys2.outputs.msys2-location }}')/mingw64/bin"
          cargo xtask abi-differential --target x86_64-windows-gnu

  # Rung 0 for i686-windows-gnu. The 32-bit programs run under WoW64, so they meet the Windows
  # loader and UCRT rather than Wine's. A job of its own, so that a failure in the x86-64 programs
  # above does not keep this one from running.
  windows-i686:
    name: i686 windows rung 0
    needs: quick
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build rucc, the sysroot and the runtime
        run: |
          cargo build --release --bin rucc
          ./target/release/rucc.exe --fetch i686-windows-gnu
          cargo xtask builtins --target i686-windows-gnu
      - name: run rung 0
        run: tests/rung0/run.sh "$PWD/target/release/rucc.exe" i686-windows-gnu

  # The same programs built by rucc on Windows on Arm, with llvm-mingw's clang for AArch64 as the
  # reference, since MSYS2 has no GCC for it. llvm-mingw also brings the lld that rucc links with.
  # The release is pinned by hash like every other download here.
  windows-arm:
    name: aarch64 windows programs on windows
    needs: quick
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install rustup if the image has none
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain none
            echo "$USERPROFILE\.cargo\bin" >> "$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@v2.9.2
      - name: fetch llvm-mingw
        run: |
          curl -fsSL -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-ucrt-aarch64.zip
          echo "a317514a7a63badd692032c0c2b8e165f630bbaebbe7a3254348051f43a64949  llvm-mingw.zip" | sha256sum -c -
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/llvm-mingw-20260922-ucrt-aarch64/bin" >> "$GITHUB_PATH"
      - name: build rucc, the sysroot and the runtime
        run: |
          cargo build --release --bin rucc
          ./target/release/rucc.exe --fetch aarch64-windows-gnu
          cargo xtask builtins --target aarch64-windows-gnu
      - name: nothing writes x18
        run: tests/exec/windows/x18.sh "$PWD/target/release/rucc.exe --target=aarch64-windows-gnu"
      - name: run tests/exec/windows with rucc
        # Run even when the x18 check fails, since the two say different things.
        if: ${{ !cancelled() }}
        run: tests/exec/windows/run.sh "$PWD/target/release/rucc.exe --target=aarch64-windows-gnu"
      - name: run tests/exec/windows with llvm-mingw clang
        # Run even when the x18 check fails, since the two say different things.
        if: ${{ !cancelled() }}
        run: tests/exec/windows/run.sh aarch64-w64-mingw32-clang

  # rucc on Windows and rucc on Linux have to write the same object for the same source and
  # target. The two jobs above each hash what they wrote and this compares the lists.
  windows-objects:
    name: the same objects from windows and linux
    needs: [wine, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: objects-*
          merge-multiple: true
      - name: compare
        run: diff objects-linux.txt objects-windows.txt

  # spec/safe-memory/03-bug-model.md section 3.7 says every row of the bug model has test cases
  # and a number in CI. This is that number. It is the only job that runs what the compiler
  # produced rather than reading it, which it can do here because the runner is the machine the
  # back end emits code for.
  safety:
    name: memory safety suite
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # The runtime is compiled for the target rather than for the host, so the standard library
      # for that target has to be there even though it is the same machine.
      - name: install the target library
        run: rustup target add x86_64-unknown-linux-gnu
      - name: run every program in tests/safety
        run: cargo xtask safety

  # spec/safe-memory/14-verification.md section 14.3, and the same programs at -O2 rather than at
  # -O0. Each one is built twice, once with the elimination passes disabled and once normally, and
  # the two runs have to say the same thing. A report in the first that is missing from the second
  # is a check the pass removed that had something to say, which is the failure no amount of rule
  # checking finds, because there the rule is right and the walk that applied it is not.
  #
  # This was a nightly job on the grounds that building the suite twice doubles what it costs. It
  # does, and the doubling is nineteen seconds against nine, which is not a reason to leave the
  # only run of an instrumented program through the optimizer off the per-commit job. tamnd/rucc#818
  # is what that cost: a divide by zero in loop splitting that this catches on a case that was
  # already in the suite, and that nothing said a word about until somebody compiled SQLite by hand.
  accounting:
    name: what the elimination took out
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install the target library
        run: rustup target add x86_64-unknown-linux-gnu
      - name: build tests/safety with the elimination off and on
        run: cargo xtask accounting

  # Every program in the suite above is a few lines of C written to provoke one judgement, which is
  # the right shape for asking whether a check fires and the wrong shape for asking whether a real
  # library survives the monitor. tamnd/rucc#1307 is what the gap between those two questions costs:
  # a hole nothing in the suite could see, found by somebody compiling SQLite by hand. Three more of
  # the same shape have been found since and every one of them was found the same way, so this is
  # that by hand run made standing.
  #
  # The sources are fetched rather than vendored, because they are somebody else's C and a copy of
  # them would be in this compiler's history forever. They are pinned by hash for the ordinary
  # reason, and the checks do not care which versions they get: the workloads are ordinary use of
  # each library and their answers are arithmetic.
  libraries:
    name: instrumented libraries that have to be right
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install the target library
        run: rustup target add x86_64-unknown-linux-gnu
      - name: fetch the sqlite amalgamation
        run: |
          curl -fsSL -o sqlite.tar.gz https://sqlite.org/2026/sqlite-autoconf-3530400.tar.gz
          echo "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c  sqlite.tar.gz" | sha256sum -c -
          tar xzf sqlite.tar.gz
      - name: fetch the zlib sources
        run: |
          curl -fsSL -o zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          echo "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23  zlib.tar.gz" | sha256sum -c -
          tar xzf zlib.tar.gz
      - name: fetch the lua sources
        run: |
          curl -fsSL -o lua.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
          echo "4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae  lua.tar.gz" | sha256sum -c -
          tar xzf lua.tar.gz
      - name: fetch the brotli sources
        run: |
          curl -fsSL -o brotli.tar.gz https://github.com/google/brotli/archive/refs/tags/v1.1.0.tar.gz
          echo "e720a6ca29428b803f4ad165371771f5398faba397edf6778837a18599ea13ff  brotli.tar.gz" | sha256sum -c -
          tar xzf brotli.tar.gz
      - name: fetch the zstd sources
        run: |
          curl -fsSL -o zstd.tar.gz https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
          echo "eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3  zstd.tar.gz" | sha256sum -c -
          tar xzf zstd.tar.gz
      - name: build them at both levels and hold them to their answers
        run: cargo xtask libraries
        env:
          RUCC_SQLITE_AMALGAMATION: ${{ github.workspace }}/sqlite-autoconf-3530400
          RUCC_ZLIB_SOURCE: ${{ github.workspace }}/zlib-1.3.1
          RUCC_LUA_SOURCE: ${{ github.workspace }}/lua-5.4.8
          RUCC_BROTLI_SOURCE: ${{ github.workspace }}/brotli-1.1.0
          RUCC_ZSTD_SOURCE: ${{ github.workspace }}/zstd-1.5.7

  # spec/cross-compile/14-testing.md section 14.3 is layer 6 of the ladder, and it is the only
  # layer that can see a calling convention at all: everything cheaper than it reads what the
  # compiler produced, and where an argument travels is not in the source. It is its own job for
  # the same reason the suite above is, and it runs directly here because this runner is the
  # machine the back end emits code for, so none of the emulation caveats in section 14.4 apply
  # to this run.
  abi-differential:
    name: differential abi
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: compile the signature corpus both ways round and run it
        run: cargo xtask abi-differential

  audit:
    name: supply chain
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.87.2
        with:
          tool: cargo-deny
      # Licenses, advisories, banned crates and unknown registries, all configured in
      # deny.toml and justified in spec/18-package-layout.md section 18.3.
      - name: cargo deny
        run: cargo deny --all-features check
      # The count is of crates and not of lines, which is why the trailing marker cargo puts on a
      # subtree it has already printed is cut off first. Without that a crate two others both
      # depend on is counted twice and the number drifts upwards on its own.
      - name: report the dependency count
        run: |
          set -euo pipefail
          count() {
            cargo tree "$@" --edges normal --prefix none --all-features \
              | sed 's/ (\*)$//' | sort -u | grep -c . || true
          }
          echo "the compiler: $(count -p rucc) crates including transitives"
          echo "the workspace: $(count --workspace) crates, which adds the test and build tooling"
          echo "The budget in spec/18-package-layout.md section 18.3 is under fifty."

  # The differential against a real GCC over a real header set, which is the M1 exit
  # criterion in spec/17-milestones.md. The harness and the corpora live in
  # tamnd/rucc-compat, because a compiler repository that vendors glibc is a compiler
  # repository nobody can read the license of. This job is the compiler side of it: every
  # commit here is measured against the headers of the machine it would be used on.
  #
  # This was advisory while the standard header set was still coming out unequal, on the
  # grounds that a gate which is red for a known reason teaches everyone to ignore it. Both
  # libcs now come out at 29 of 29 on that set, so it is a gate. Preprocessing a header the
  # same way the reference compiler does is not a thing to regress quietly.
  differential:
    name: differential against ${{ matrix.libc }}
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            container: ""
          - libc: musl
            container: alpine:3.22
    container: ${{ matrix.container }}
    steps:
      - name: alpine needs a toolchain and a compiler to compare against
        if: matrix.libc == 'musl'
        run: apk add --no-cache cargo git build-base
      # The reference is GCC 16, which is the current release, because a compiler measured
      # against a compiler four years old is measured against the wrong thing: gcc 16 defines
      # __CHAR8_TYPE__ in C23 and gcc 13 defines it in no dialect, and its own stdatomic.h
      # declares a type behind that macro. Ubuntu 24.04 ships 13, so this comes from the
      # toolchain PPA. Alpine has no equivalent and keeps its own, which is fine there: the
      # musl job is about musl's headers rather than about the reference's version.
      - name: the reference compiler
        if: matrix.libc == 'glibc'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y gcc-16
          gcc-16 --version | head -1
      - uses: actions/checkout@v7.0.1
      - name: check out the harness
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc-compat
          path: compat
      - name: build the compiler
        run: cargo build --release --bin rucc
      - name: build the harness
        run: cargo build --release --manifest-path compat/Cargo.toml
      # The standard headers are the ones every program includes, so they are the ones worth
      # failing over. The sweep across everything installed runs nightly in the other
      # repository, where the corpora are.
      - name: the standard headers
        working-directory: compat
        env:
          CC: ${{ matrix.libc == 'glibc' && 'gcc-16' || 'cc' }}
        run: |
          ./target/release/rucc-compat run ${{ matrix.libc }} \
            --unit standard --rucc ../target/release/rucc --report
      # Reading a header the same way the reference does and building a program out of it are
      # two claims, and this is the cheapest place to make the second one, because the machine
      # already has the libc, its headers and a linker. The program is deliberately dull: it
      # includes <stdio.h>, calls getc, and asks for optimization, which is the shape that used
      # to fail to link on __builtin_expect without the source ever mentioning it.
      #
      # glibc only. Whether the link line the driver builds is right on musl is a real question
      # and a separate one, and finding the answer to it inside a gate would make this job red
      # for a reason that has nothing to do with the commit under it.
      - name: a program built out of those headers runs
        if: matrix.libc == 'glibc'
        env:
          CC: gcc-16
        run: |
          cat > /tmp/hint.c <<'EOF'
          #include <stdio.h>
          int main(void)
          {
            FILE *f = fopen("/dev/null", "r");
            if (f == NULL) return 1;
            int c = getc(f);
            fclose(f);
            printf("%d %ld %zu\n", c < 0, __builtin_expect(7L, 1),
                   sizeof(__builtin_expect((char)1, 1)));
            return 0;
          }
          EOF
          for level in 0 1 2 3 s; do
            ./target/release/rucc -std=gnu17 -O$level /tmp/hint.c -o /tmp/hint-rucc
            $CC -std=gnu17 -O$level /tmp/hint.c -o /tmp/hint-cc
            ours=$(/tmp/hint-rucc)
            theirs=$(/tmp/hint-cc)
            echo "-O$level: ours [$ours] theirs [$theirs]"
            test "$ours" = "$theirs"
          done
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: differential-${{ matrix.libc }}
          path: compat/results/
          if-no-files-found: ignore

  # PostgreSQL 18.6 built by rucc at -O0 and held to its own regression suite, which is the per
  # commit job of the PG2 milestone in tamnd/rucc#1989. The configuration is the minimal one
  # tamnd/rucc-postgres uses, less the TAP tests, which make check does not run. The release tarball
  # is used rather than a clone because it carries the generated parser and scanner, so the job
  # needs neither bison nor flex, and it is pinned by its checksum. The Postgres part is meant to
  # stay under fifteen minutes.
  postgres:
    name: postgres make check at -O0
    needs: quick
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PG_VERSION: "18.6"
      PG_SHA256: 555610c24d53e4316da5b7d3fc25c279d96856d5e0e23ee308c328c5fa881d9f
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build rucc
        run: cargo build --release --bin rucc
      - name: fetch postgres
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o pg.tar.bz2 "https://ftp.postgresql.org/pub/source/v$PG_VERSION/postgresql-$PG_VERSION.tar.bz2"
          echo "$PG_SHA256  pg.tar.bz2" | sha256sum -c -
          tar xjf pg.tar.bz2
      - name: configure
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/postgresql-$PG_VERSION"
          ./configure CC="$GITHUB_WORKSPACE/target/release/rucc" CFLAGS=-O0 \
            --without-icu --without-readline --without-zlib --without-llvm \
            --disable-nls --disable-cassert --enable-debug
      - name: build
        run: make -C "$RUNNER_TEMP/postgresql-$PG_VERSION" -j"$(nproc)" -s
      - name: make check
        run: make -C "$RUNNER_TEMP/postgresql-$PG_VERSION" check
      - name: keep the differences
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: postgres-regress
          path: |
            ${{ runner.temp }}/postgresql-${{ env.PG_VERSION }}/config.log
            ${{ runner.temp }}/postgresql-${{ env.PG_VERSION }}/src/test/regress/regression.diffs
            ${{ runner.temp }}/postgresql-${{ env.PG_VERSION }}/src/test/regress/log/
          if-no-files-found: ignore

  # A single required check, so branch protection does not have to list every job above. It is the
  # only check the main ruleset requires, which means a job missing from this list runs, reports and
  # blocks nothing, and three of them were missing: the stub reader, the safety suite and the
  # elimination accounting. So the list is every job in the file, and a job added above has to be
  # added here in the same commit, because the alternative is a red tick nobody has to look at.
  ci:
    name: ci
    if: always()
    needs: [quick, test, docs, solver, msrv, determinism, disasm, stubs, implib, wine, qemu, i686, wasm, litmus, windows, windows-i686, windows-objects, safety, accounting, audit, differential, abi-differential, postgres]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
