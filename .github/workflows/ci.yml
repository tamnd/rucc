# The per-commit gate. Everything here is required to merge.
#
# The matrix is the first three rows of the table in spec/15-testing.md section 15.7. The
# cross-compilation and QEMU rows arrive with the second target in M6.
#
# Actions are pinned to a patch version rather than a major tag. A major tag is a moving
# reference, and a compiler project that cannot reproduce its own CI run has given up
# something it needs.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# A force-push should cancel the run it replaced. The default branch is exempt, because a
# main-branch run is what the badge and the bisect history read from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Cheapest checks first, so a formatting mistake costs seconds rather than a full matrix.
  quick:
    name: format, lints and house rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: layer rule
        run: cargo xtask layers
      - name: prose style
        run: cargo xtask style
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    # Runner images are named explicitly rather than through `-latest`, so that an image
    # rollout shows up as a commit rather than as yesterday's green run turning red. The
    # policy is the newest generally available image per host: Ubuntu 26.04 exists but is
    # still marked preview, so Linux stays on 24.04 until it is not.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64, debug
            os: ubuntu-24.04
            profile: dev
          - name: linux x86-64, release
            os: ubuntu-24.04
            profile: release
          - name: macos arm64
            os: macos-26
            profile: dev
          - name: windows x86-64
            os: windows-2025
            profile: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.profile }}
      - name: cargo build
        run: cargo build --workspace --all-features --profile ${{ matrix.profile }}
      - name: cargo test
        run: cargo test --workspace --all-features --profile ${{ matrix.profile }}
      # The M0 exit criterion in spec/17-milestones.md is that this works and is correct on
      # all three hosts, so it is checked rather than assumed.
      - name: rucc --print-config
        shell: bash
        run: |
          set -euo pipefail
          dir=${{ matrix.profile == 'dev' && 'debug' || 'release' }}
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          "./target/$dir/rucc$exe" --print-config
          "./target/$dir/rucc$exe" --version

  docs:
    name: documentation
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # Every crate is published, so every crate's documentation has to build. A broken
      # intra-doc link is a broken link on docs.rs.
      - name: cargo doc
        run: cargo doc --workspace --all-features --no-deps

  solver:
    name: rule verification
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # The release from upstream rather than the one in the distribution, which is four years
      # old here and does not know the name of the logic a question about arrays and floats at
      # once is asked in. It answers such a question anyway, after saying it ignored the logic,
      # and an answer from a solver that ignored what it was asked in is not one to count.
      - name: a solver to discharge the rules against
        run: |
          set -euo pipefail
          version=5.1.0
          build=z3-$version-x64-glibc-2.39
          curl -fsSL -o z3.zip \
            "https://github.com/Z3Prover/z3/releases/download/z3-$version/$build.zip"
          unzip -q z3.zip
          sudo install -m 755 "$build/bin/z3" /usr/local/bin/z3
          z3 --version
      # The verification tests skip themselves when no solver is on PATH, so that a machine
      # without one still runs everything else. That is the right default and the wrong thing
      # to rely on in CI, where a solver that failed to install would turn into a silent gap
      # rather than a red run. This job is the one place the skip is an error.
      - name: cargo test
        env:
          RUCC_REQUIRE_SOLVER: "1"
        run: cargo test -p rucc-verify --all-features
      # The gate itself, over every rule file in the tree. It stood before there was a rule set
      # to gate, so the rules landed into it rather than after it, and it is what keeps the next
      # rule from being the first unproved one.
      - name: no rule enters the rule set unverified
        run: cargo run -q -p rucc-verify -- crates/rucc-codegen/rules

  msrv:
    name: minimum supported rust version
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: read the floor from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: install
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
      # A compiler that needs last week's stable Rust is a compiler people cannot use on the
      # systems where they need it, per spec/18-package-layout.md section 18.6. The floor is
      # raised deliberately, in a commit, not by accident in a dependency bump.
      - name: cargo check
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-features

  determinism:
    name: reproducible output
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      # spec/02-the-goal.md makes byte-identical output a requirement. Right now there is no
      # compiler output to compare, so this checks that the compiler itself builds twice to
      # the same bytes, which is the same property one level down and catches the hash-order
      # and timestamp mistakes early, while they are still cheap to fix.
      - name: build twice and compare
        run: |
          set -euo pipefail
          cargo build --release --bin rucc
          sha256sum target/release/rucc > first.sha256
          rm -rf target/release/rucc target/release/.fingerprint
          cargo build --release --bin rucc
          sha256sum target/release/rucc > second.sha256
          diff <(cut -d' ' -f1 first.sha256) <(cut -d' ' -f1 second.sha256)
          echo "the compiler builds reproducibly"

  # spec/11-asm-objects-debug.md section 11.1 says every instruction we encode is read back by a
  # decoder that has never seen our table. An encoding bug is silent, survives every test that
  # does not run the program, and costs a day to find from the far end, so it is caught here.
  disasm:
    name: differential disassembly
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: install the decoder
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: read back every instruction we encode
        run: cargo xtask disasm

  audit:
    name: supply chain
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/install-action@v2.87.2
        with:
          tool: cargo-deny
      # Licenses, advisories, banned crates and unknown registries, all configured in
      # deny.toml and justified in spec/18-package-layout.md section 18.3.
      - name: cargo deny
        run: cargo deny --all-features check
      # The count is of crates and not of lines, which is why the trailing marker cargo puts on a
      # subtree it has already printed is cut off first. Without that a crate two others both
      # depend on is counted twice and the number drifts upwards on its own.
      - name: report the dependency count
        run: |
          set -euo pipefail
          count() {
            cargo tree "$@" --edges normal --prefix none --all-features \
              | sed 's/ (\*)$//' | sort -u | grep -c . || true
          }
          echo "the compiler: $(count -p rucc) crates including transitives"
          echo "the workspace: $(count --workspace) crates, which adds the test and build tooling"
          echo "The budget in spec/18-package-layout.md section 18.3 is under fifty."

  # The differential against a real GCC over a real header set, which is the M1 exit
  # criterion in spec/17-milestones.md. The harness and the corpora live in
  # tamnd/rucc-compat, because a compiler repository that vendors glibc is a compiler
  # repository nobody can read the license of. This job is the compiler side of it: every
  # commit here is measured against the headers of the machine it would be used on.
  #
  # This was advisory while the standard header set was still coming out unequal, on the
  # grounds that a gate which is red for a known reason teaches everyone to ignore it. Both
  # libcs now come out at 29 of 29 on that set, so it is a gate. Preprocessing a header the
  # same way the reference compiler does is not a thing to regress quietly.
  differential:
    name: differential against ${{ matrix.libc }}
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            container: ""
          - libc: musl
            container: alpine:3.22
    container: ${{ matrix.container }}
    steps:
      - name: alpine needs a toolchain and a compiler to compare against
        if: matrix.libc == 'musl'
        run: apk add --no-cache cargo git build-base
      # The reference is GCC 16, which is the current release, because a compiler measured
      # against a compiler four years old is measured against the wrong thing: gcc 16 defines
      # __CHAR8_TYPE__ in C23 and gcc 13 defines it in no dialect, and its own stdatomic.h
      # declares a type behind that macro. Ubuntu 24.04 ships 13, so this comes from the
      # toolchain PPA. Alpine has no equivalent and keeps its own, which is fine there: the
      # musl job is about musl's headers rather than about the reference's version.
      - name: the reference compiler
        if: matrix.libc == 'glibc'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y gcc-16
          gcc-16 --version | head -1
      - uses: actions/checkout@v7.0.1
      - name: check out the harness
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc-compat
          path: compat
      - name: build the compiler
        run: cargo build --release --bin rucc
      - name: build the harness
        run: cargo build --release --manifest-path compat/Cargo.toml
      # The standard headers are the ones every program includes, so they are the ones worth
      # failing over. The sweep across everything installed runs nightly in the other
      # repository, where the corpora are.
      - name: the standard headers
        working-directory: compat
        env:
          CC: ${{ matrix.libc == 'glibc' && 'gcc-16' || 'cc' }}
        run: |
          ./target/release/rucc-compat run ${{ matrix.libc }} \
            --unit standard --rucc ../target/release/rucc --report
      # Reading a header the same way the reference does and building a program out of it are
      # two claims, and this is the cheapest place to make the second one, because the machine
      # already has the libc, its headers and a linker. The program is deliberately dull: it
      # includes <stdio.h>, calls getc, and asks for optimization, which is the shape that used
      # to fail to link on __builtin_expect without the source ever mentioning it.
      #
      # glibc only. Whether the link line the driver builds is right on musl is a real question
      # and a separate one, and finding the answer to it inside a gate would make this job red
      # for a reason that has nothing to do with the commit under it.
      - name: a program built out of those headers runs
        if: matrix.libc == 'glibc'
        env:
          CC: gcc-16
        run: |
          cat > /tmp/hint.c <<'EOF'
          #include <stdio.h>
          int main(void)
          {
            FILE *f = fopen("/dev/null", "r");
            if (f == NULL) return 1;
            int c = getc(f);
            fclose(f);
            printf("%d %ld %zu\n", c < 0, __builtin_expect(7L, 1),
                   sizeof(__builtin_expect((char)1, 1)));
            return 0;
          }
          EOF
          for level in 0 1 2 3 s; do
            ./target/release/rucc -std=gnu17 -O$level /tmp/hint.c -o /tmp/hint-rucc
            $CC -std=gnu17 -O$level /tmp/hint.c -o /tmp/hint-cc
            ours=$(/tmp/hint-rucc)
            theirs=$(/tmp/hint-cc)
            echo "-O$level: ours [$ours] theirs [$theirs]"
            test "$ours" = "$theirs"
          done
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: differential-${{ matrix.libc }}
          path: compat/results/
          if-no-files-found: ignore

  # A single required check, so branch protection does not have to list every job above.
  ci:
    name: ci
    if: always()
    needs: [quick, test, docs, solver, msrv, determinism, disasm, audit, differential]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
