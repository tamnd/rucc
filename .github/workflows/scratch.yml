name: scratch
on:
  push:
    branches: [remat-addresses]
jobs:
  look:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: rustup target add x86_64-unknown-linux-gnu
      - run: |
          curl -fsSL -o lua.tar.gz https://www.lua.org/ftp/lua-5.4.8.tar.gz
          tar xzf lua.tar.gz
          curl -fsSL -o brotli.tar.gz https://github.com/google/brotli/archive/refs/tags/v1.1.0.tar.gz
          tar xzf brotli.tar.gz
      - run: cargo xtask libraries || true
        env:
          RUCC_LUA_SOURCE: ${{ github.workspace }}/lua-5.4.8
          RUCC_BROTLI_SOURCE: ${{ github.workspace }}/brotli-1.1.0
      - run: bash .github/scratch/look.sh
        env:
          RUCC_LUA_SOURCE: ${{ github.workspace }}/lua-5.4.8/src
          RUCC_BROTLI_SOURCE: ${{ github.workspace }}/brotli-1.1.0
