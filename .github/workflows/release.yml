# Tagged releases: build the binary on every host we claim to support, attest it, publish
# the archives to GitHub and publish the source to crates.io.
#
# The portability claim in spec/02-the-goal.md is axis 4, and a release that only ships a
# Linux binary quietly retracts it. So the matrix here is the same three hosts CI runs on,
# and a host that fails to build blocks the release rather than being dropped from it.
#
# crates.io comes last on purpose. A version there cannot be taken back, only yanked, so
# nothing is uploaded until the tag has passed the gate and built everywhere.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to build, for a dry run
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A tag that does not pass the gate does not become a release. Cheaper to find out here
  # than after the artifacts are uploaded.
  verify:
    name: verify the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: the version in the tag matches the workspace
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          want="${tag#v}"
          have=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$want" != "$have" ]; then
            echo "tag $tag says $want but Cargo.toml says $have"
            exit 1
          fi
          echo "releasing $have"
      - name: the changelog has an entry
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          grep -q "## ${tag#v}" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${tag#v}"
            exit 1
          }
      - run: cargo xtask ci
      # Every sysroot this release pins, fetched the way a user fetches it. Two other things already
      # look at these pins and neither of them asks this question. `cargo xtask provenance --check`
      # in the gate above says PROVENANCE matches the tables it is generated from, which is a
      # question about two files in this repository. The nightly run in tamnd/rucc-cross rebuilds
      # each sysroot from source and holds the archive against the hash named here, which is a
      # question about the recipe. Neither of them asks whether the URL still serves the file, and a
      # pin that has gone is a compiler that builds, passes everything, ships, and then cannot get a
      # sysroot on the first machine that asks for one.
      #
      # `--fetch` rather than curl and sha256sum, because it is the code path a user is on: choosing
      # a downloader, the cache layout, the hash check and the refusal are all the compiler's, and
      # all of them are being asked here rather than approximated. Three archives of a few megabytes
      # is seconds, and the from source reproduction that costs nine minutes stays in the nightly
      # where it already is, which is the decision section 13.6 left open.
      - name: every pinned sysroot is still there and still hashes to what it says
        run: |
          set -euo pipefail
          pinned=$(awk -F'\t' '$1 == "target" && $3 == "pinned" { print $2 }' PROVENANCE)
          if [ -z "$pinned" ]; then
            echo "PROVENANCE pins no sysroots, which is either a table that changed shape or a"
            echo "column that moved, and a check that quietly passes when it finds nothing is not"
            echo "a check. If unpinning all of them was deliberate, this step goes with them."
            exit 1
          fi
          cargo build --release --bin rucc
          for target in $pinned; do
            ./target/release/rucc --fetch "$target"
          done

  # The runtime every cross link ends with, built once here and put in every archive, so that a
  # release user gets a Windows or Linux program out of `--target` without a source checkout and a
  # `cargo xtask builtins` of their own. One host is enough, because the archive is the compiler's
  # output for the target and does not depend on which machine ran it. The list is the targets whose
  # builtins this compiler can build today, written out rather than discovered, so that one of them
  # breaking fails the release instead of quietly shipping without it.
  builtins:
    name: builtins for every cross target
    needs: verify
    runs-on: ubuntu-24.04
    env:
      TARGETS: x86_64-linux-gnu x86_64-linux-musl aarch64-linux-gnu aarch64-linux-musl x86_64-windows-gnu aarch64-macos
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build them
        run: |
          set -euo pipefail
          for target in $TARGETS; do
            cargo xtask builtins --target "$target"
            mkdir -p "lib/rucc/$target"
            cp "target/$target/release/librucc_builtins.a" "lib/rucc/$target/"
          done
          find lib -type f | sort
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: builtins
          path: lib
          if-no-files-found: error
          retention-days: 7

  build:
    name: build for ${{ matrix.target }}
    needs: [verify, builtins]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: add the target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --bin rucc --target ${{ matrix.target }}
      # Section 13.1 of spec/cross-compile/13-distribution.md says a regression against the size
      # budget blocks a release the way a benchmark regression does, so it is checked here rather
      # than in CI: this is the job that has the real release binary for this target, and it is the
      # release that the budget is about. Nothing is built again, the step measures what the step
      # above produced.
      - name: size
        run: cargo xtask size --target ${{ matrix.target }} --no-build
      - uses: actions/download-artifact@v8.0.1
        with:
          name: builtins
          path: builtins/lib
      # Both formats, because the people who want a .zip and the people who want a .tar.gz do
      # not overlap and neither group should have to install a tool. The script is what makes
      # the two of them reproducible, which is section 13.6 of
      # spec/cross-compile/13-distribution.md, and it packages twice and fails the release if
      # the two runs disagree. It is a script rather than lines of YAML so that it can be run
      # and therefore tested, the same reason .github/publish-crates.sh is one.
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="rucc-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target }}"
          binary="target/${{ matrix.target }}/release/rucc"
          if [ "$RUNNER_OS" = "Windows" ]; then
            binary="$binary.exe"
          fi
          .github/package.sh "$name" "$binary" dist builtins/lib
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  # What a release user does first, done with the archive they would download: unpack it on a
  # clean Linux machine, fetch the Windows sysroot, and link hello world with nothing but
  # `--target`. lld comes from `apt install lld-19`, which is what the compiler tells an Ubuntu
  # 24.04 user to run, and it is left off PATH on purpose, because finding it in
  # /usr/lib/llvm-19/bin is part of what is being checked.
  smoke:
    name: smoke test the Linux archive
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist-x86_64-unknown-linux-gnu
          path: dist
      - name: install lld 19
        run: sudo apt-get install -y lld-19
      - name: hello world for Windows from the archive alone
        run: |
          set -euo pipefail
          mkdir unpacked
          tar -xzf dist/*.tar.gz -C unpacked
          rucc=$(echo unpacked/*/rucc)
          "$rucc" --fetch x86_64-windows-gnu
          printf '#include <stdio.h>\nint main(void) { puts("hello"); return 0; }\n' > hello.c
          "$rucc" --target=x86_64-windows-gnu hello.c -o hello.exe
          file hello.exe
          file hello.exe | grep -q 'PE32+ executable'

  publish:
    name: publish
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # Provenance attestation, so that someone downloading a binary can check which
      # workflow run and which commit produced it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: list what is being published
        run: ls -l dist
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # The release notes are the changelog section, written by hand, rather than a list of
      # commit subjects. GitHub's generated list of merged pull requests is appended after it
      # for anyone who wants the detail.
      - name: take the release notes from the changelog
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          awk -v want="## ${tag#v}" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $tag"; exit 1; }
          cat notes.md
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          # Pre-1.0 carries no compatibility promise, per spec/18-package-layout.md section
          # 18.6, and marking the release accordingly is the honest way to say so.
          prerelease: ${{ !startsWith(github.ref_name, 'v1.') && !startsWith(github.ref_name, 'v2.') }}
          fail_on_unmatched_files: true

  # Every crate in the workspace goes to crates.io, in dependency order, which cargo works
  # out for itself from the workspace graph. They are versioned and released together per
  # spec/18-package-layout.md section 18.6, so a partial upload is a bug rather than a
  # supported state, and `--locked` means the published tree resolves to exactly what CI
  # tested rather than to whatever was newest that morning. The script is what makes a
  # partial upload recoverable rather than permanent: it excludes what the index already has
  # and waits out the registry's rate limit, so re-running this job finishes the release.
  #
  # This does not run for a workflow_dispatch dry run. A dry run is for checking that the
  # binaries build, and an upload to crates.io cannot be undone.
  crates-io:
    name: publish to crates.io
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # No cache step here on purpose. This job compiles the workspace once, during the
      # verification `cargo publish` does of each crate, and never reads it again, so a cache
      # saves nothing and its post step walks a `target/package` tree that cargo is deleting
      # underneath it and reports the races as errors on the release run, which is the worst
      # run to have meaningless red marks on.
      - uses: actions/checkout@v7.0.1
      - name: publish the workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: .github/publish-crates.sh
