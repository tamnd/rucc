[workspace]
resolver = "3"
members = [
    "crates/*",
    "build-tools/*",
    "runtime/rucc-builtins",
    "xtask",
]

[workspace.package]
version = "0.2.13"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tamnd/rucc"
homepage = "https://github.com/tamnd/rucc"
authors = ["tamnd <tamnd87@gmail.com>"]
keywords = ["c", "compiler", "codegen", "optimizer", "toolchain"]
categories = ["compilers", "development-tools"]
# Inherited paths are resolved from the workspace root, so one line here gives every
# published crate a page on crates.io instead of a blank one.
readme = "README.md"

# One version number for the whole workspace, bumped together, per spec/18-package-layout.md
# section 18.6. Internal crates are pinned exactly so that a partial publish cannot produce a
# mixed-version build.
[workspace.dependencies]
rucc-asm = { version = "=0.2.13", path = "crates/rucc-asm" }
rucc-ast = { version = "=0.2.13", path = "crates/rucc-ast" }
rucc-base = { version = "=0.2.13", path = "crates/rucc-base" }
rucc-codegen = { version = "=0.2.13", path = "crates/rucc-codegen" }
rucc-debug = { version = "=0.2.13", path = "crates/rucc-debug" }
rucc-diag = { version = "=0.2.13", path = "crates/rucc-diag" }
rucc-driver = { version = "=0.2.13", path = "crates/rucc-driver" }
rucc-gnu = { version = "=0.2.13", path = "crates/rucc-gnu" }
rucc-ir = { version = "=0.2.13", path = "crates/rucc-ir" }
rucc-lex = { version = "=0.2.13", path = "crates/rucc-lex" }
rucc-lower = { version = "=0.2.13", path = "crates/rucc-lower" }
rucc-lto = { version = "=0.2.13", path = "crates/rucc-lto" }
rucc-mir = { version = "=0.2.13", path = "crates/rucc-mir" }
rucc-object = { version = "=0.2.13", path = "crates/rucc-object" }
rucc-opt = { version = "=0.2.13", path = "crates/rucc-opt" }
rucc-parse = { version = "=0.2.13", path = "crates/rucc-parse" }
rucc-pp = { version = "=0.2.13", path = "crates/rucc-pp" }
rucc-regalloc = { version = "=0.2.13", path = "crates/rucc-regalloc" }
rucc-sema = { version = "=0.2.13", path = "crates/rucc-sema" }
rucc-session = { version = "=0.2.13", path = "crates/rucc-session" }
rucc-target = { version = "=0.2.13", path = "crates/rucc-target" }
rucc-types = { version = "=0.2.13", path = "crates/rucc-types" }
# The compiler's only dependency outside the workspace, blessed by spec/18-package-layout.md
# section 18.5. It is here rather than in the one crate that uses it so that the next one to be
# proposed has to be added to a list a reviewer reads, which is the point of keeping the list.
memmap2 = "0.9.11"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# The arenas and the memory-mapped source handling are where our unsafe lives, and
# spec/15-testing.md section 15.6 requires every block of it to carry a justification.
undocumented_unsafe_blocks = "warn"
doc_markdown = "allow"
missing_panics_doc = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# A compiler is profiled far more often than it is shipped, so the release profile we
# actually develop against keeps frame pointers and debug info.
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.bench]
inherits = "profiling"

# Tests run with the IR verifier and the allocation checker on, which makes an unoptimized
# test binary painfully slow on the larger corpus inputs. Optimizing dependencies only keeps
# our own code debuggable while making the run bearable.
[profile.dev.package."*"]
opt-level = 2
