# Build tooling, outside the layer stack, and with no dependencies at all. What it reads is
# header text and what it writes is header text, so the compiler's own crates have nothing to
# say about it, and it is a separate binary from `xtask` because `xtask` is the thing that has
# to keep working when everything else is broken.
