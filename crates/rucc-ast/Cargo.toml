[package]
name = "rucc-ast"
description = "The arena-allocated AST and its printer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

# Ranks 0, 1 and 4, all below this crate's rank 6. `rucc-lex` is here for the converted
# constants and literals, which the tree holds rather than re-reading from the source. There is
# no `rucc-types` here and there is not meant to be: the tree records what was written and knows
# nothing about what it means, which is what `rucc-sema` is for.
[dependencies]
rucc-base.workspace = true
rucc-diag.workspace = true
rucc-lex.workspace = true
