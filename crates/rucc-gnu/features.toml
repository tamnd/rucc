# The time stamp counter. gcc writes the instruction in place and so does rucc, as its bytes in an
# asm statement the lowering writes, so an object that reads the counter needs no library. These
# were calls into librucc_builtins.a once, which left two undefined names in every object gcc linked
# or dlopen loaded (#2191). Postgres 19 reads it in instr_time.h on every x86-64 build, with no
# header.

[[feature]]
name = "__builtin_ia32_rdtsc"
kind = "builtin"
gcc_version = "4.5"
status = "implemented"
signature = "unsigned long long(void)"
used_by = ["postgres"]
tests = ["rucc-driver::the_time_stamp_counter_is_the_instruction_in_place"]
notes = "The counter, with edx in the high half and eax in the low half, which is what gcc answers. The signature is kept because the call is checked against it, and the node is put in its place after that in check/builtin/tsc.rs. Refused on every target but x86-64."

[[feature]]
name = "__builtin_ia32_rdtscp"
kind = "builtin"
gcc_version = "4.5"
status = "implemented"
signature = "unsigned long long(unsigned int *)"
used_by = ["postgres"]
tests = ["rucc-driver::the_time_stamp_counter_is_the_instruction_in_place"]
notes = "The counter as rdtsc gives it, waiting for earlier instructions first, with the processor's TSC_AUX stored through the pointer. In place as rdtsc is, in check/builtin/tsc.rs."

