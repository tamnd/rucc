[[feature]]
name = "nodiscard"
kind = "c-attribute"
gcc_version = "10.0"
status = "implemented"
value = "202311"
used_by = []
tests = ["rucc::a_result_thrown_away_is_said_the_way_gcc_says_it_for_each_attribute", "rucc::the_last_value_of_a_statement_expression_is_not_thrown_away_unless_the_whole_is"]
notes = "A call whose value is thrown away is a warning in gcc's words under `-Wunused-result`, with the message quoted when one was given and a note at the declaration. A cast to `void` keeps it quiet, which is what the standard asks for."

[[feature]]
name = "noreturn"
kind = "c-attribute"
gcc_version = "13.0"
status = "implemented"
value = "202311"
used_by = []
