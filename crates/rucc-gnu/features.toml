[[feature]]
name = "__builtin_islessgreater"
kind = "builtin"
gcc_version = "3.0"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc-driver::the_classification_builtins_are_comparisons_and_not_calls"]
