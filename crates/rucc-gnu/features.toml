notes = "A promise about the function that a compiler may use to merge or drop calls to it and may equally ignore, which is what this does, so nothing is lost by taking it in silence. 202311 is the value C23 as published gives it and what gcc 16 answers."

[[feature]]
name = "reproducible"
kind = "c-attribute"
gcc_version = "13.0"
status = "implemented"
value = "202311"
used_by = []
tests = ["rucc-parse::a_function_type_attribute_may_sit_between_a_definition_s_parameters_and_its_body", "tests/accept/c23-function-type-attributes.c"]
notes = "A promise about the function that a compiler may use to merge or drop calls to it and may equally ignore, which is what this does, so nothing is lost by taking it in silence. 202311 is the value C23 as published gives it and what gcc 16 answers."

# Builtins, from section 13.5. The list is the part of the several hundred that real code
# reaches for first, and it grows as the matrix fills in.

[[feature]]
name = "__builtin_constant_p"
kind = "builtin"
gcc_version = "2.0"
status = "implemented"
used_by = ["linux", "glibc", "systemd"]
tests = ["rucc-driver::builtin_constant_p_is_folded_where_it_is_written_rather_than_called", "rucc/tests/constant_p.rs"]
notes = "A constant as written is answered in the front end. Anything else read out of objects becomes an is_constant instruction that the constant-p pass answers after inlining, one where the value has become a constant or the ranges pin it to one number and zero otherwise, and zero everywhere at -O0. The pass follows its answers to the branches they decide and takes out every arm an answer rules out before code generation, which is what the kernel's BUILD_BUG_ON, percpu size switch and FORTIFY checks depend on."

[[feature]]
name = "__builtin_expect"
kind = "builtin"
gcc_version = "2.96"
status = "implemented"
signature = "long(long, long)"
used_by = ["linux", "glibc", "sqlite", "systemd", "curl"]
tests = ["rucc-driver::the_hint_builtins_are_their_first_argument_and_the_hint_leaves_no_trace"]
notes = "The value is the first argument and the second is a hint. The signature is kept because the call is checked against it, which is where the argument count message and the conversion of the first argument to long come from, and check/builtin/expect.rs builds an ExprKind::Expect after that. The hint is carried: lowering writes Opcode::Expect, and rucc_opt::expect moves the claim onto the arms of the branch the value ends up controlling and takes the instruction away, so prediction reads a weight on the edge rather than a node."

[[feature]]
name = "__builtin_expect_with_probability"
kind = "builtin"
gcc_version = "9.0"
status = "implemented"
