used_by = ["glibc"]
tests = ["rucc-driver::the_return_address_builtins_that_adjust_one_hand_it_back"]
notes = "The other direction of __builtin_extract_return_addr, and the same answer for the same reason: the argument, unchanged."

[[feature]]
name = "__builtin_frame_address"
kind = "builtin"
gcc_version = "2.0"
status = "implemented"
signature = "void *(unsigned int)"
used_by = ["linux", "glibc"]
tests = ["rucc-driver::the_frame_address_is_the_frame_pointer_after_walking_that_many_links"]
notes = "Where a frame is, which on x86-64 is what the frame pointer holds, so a function that asks for one is given a frame pointer whether or not anything else asked. A depth above zero walks that many saved frame pointers first, one load each, which is what gcc 16.2.0 writes for the same program. The depth has to be a constant, since the walk is that many instructions long, and check/builtin/frame.rs is where that is enforced along with the limit of 255 that gcc does not have. What the answer is worth is the program's own business: the chain only reaches as far as the callers that kept a frame pointer, which is why gcc documents a nonzero depth as unsafe and warns about one under -Wall."

[[feature]]
name = "__builtin_thread_pointer"
kind = "builtin"
gcc_version = "11.0"
status = "implemented"
signature = "void *(void)"
used_by = ["rpmalloc"]
tests = ["rucc-driver::the_address_of_this_thread_s_own_storage_is_read_out_of_the_segment_register"]
notes = "The address of the block of storage the running thread has, which on x86-64 is one instruction, movq %fs:0. The signature is kept because the call is checked against it, and the node is put in its place after that in check/builtin/thread.rs. What a program does with the answer is its own business, since the layout of what is behind the pointer is the C library's and not the compiler's, which is why an allocator that keeps a cache per thread writes this rather than a thread-local of its own."

[[feature]]
name = "__builtin_sponentry"
kind = "builtin"
gcc_version = "none"
status = "implemented"
targets = ["aarch64"]
signature = "void *(void)"
used_by = ["mingw-w64"]
tests = ["rucc-driver::sponentry_is_the_stack_pointer_the_function_was_entered_with"]
notes = "A clang builtin that gcc never had, AArch64 only. mingw-w64 defines setjmp on ARM64 Windows as _setjmp(buf, __builtin_sponentry()), so no header that includes setjmp.h compiles for that target without it. The answer is where the caller's arguments on the stack start, so it is lowered as the address of the first incoming stack argument and finished when the frame is laid out. Asking for it on another target is refused in check/builtin/entry.rs, as clang refuses it."

[[feature]]
name = "__builtin_cpu_init"
kind = "builtin"
gcc_version = "4.8"
status = "implemented"
signature = "void(void)"
library = "__cpu_indicator_init"
used_by = ["postgres"]
tests = ["rucc-sema::the_names_are_rows_of_the_table_that_carry_a_signature", "rucc-driver::cpu_init_is_a_call_to_the_libgcc_function_that_fills_in_the_model"]
notes = "A call to libgcc's __cpu_indicator_init, which is what gcc 16.2.0 writes. libgcc already runs it as a constructor before main, so a program only needs this in a constructor of its own that may run first. x86-64 only, and refused on any other target, because nothing there defines the function. The link finds it in libgcc.a, which the driver passes whenever there is a gcc on the machine."

[[feature]]
name = "__builtin_cpu_supports"
kind = "builtin"
gcc_version = "4.8"
status = "implemented"
signature = "int(const char *)"
used_by = ["postgres"]
tests = ["rucc-sema::the_names_are_rows_of_the_table_that_carry_a_signature", "rucc-sema::every_feature_is_a_bit_of_a_word_libgcc_has", "rucc-driver::cpu_supports_is_a_bit_of_the_words_libgcc_fills_in", "rucc-driver::a_cpu_builtin_takes_a_name_it_knows_written_as_a_literal"]
notes = "A load of the word of __cpu_model or __cpu_features2 the feature is in and an and with its bit, which is gcc 16.2.0's lowering. The answer is the bit where it stands and not a one, as in gcc, except for the top bit of a word, which gcc answers one for. Every one of the 116 names gcc 16 takes is here, the x86-64 level names included, with the bit numbers of gcc's enum processor_features, each checked against what gcc 16.2.0 compiles it to. The name has to be a string literal and an unknown name is an error, in gcc's words. x86-64 only. The table is in check/builtin/cpu.rs."

[[feature]]
name = "__builtin_cpu_is"
kind = "builtin"
gcc_version = "4.8"
status = "implemented"
