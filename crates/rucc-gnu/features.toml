[[feature]]
name = "__builtin_va_arg_pack"
kind = "builtin"
gcc_version = "4.3"
status = "partial"
signature = "int(void)"
used_by = ["glibc"]
tests = ["rucc-sema::the_argument_pack_stands_only_where_nothing_is_emitted_for_the_function_around_it", "rucc-opt::a_pack_is_the_anonymous_arguments_of_the_call_inlined", "rucc-opt::a_structure_that_would_straddle_the_registers_goes_to_memory"]
notes = "Every anonymous argument of the function around it, forwarded to another variadic call. gcc accepts it only inside a function it is going to inline, and it forwards the arguments while inlining, which `rucc_opt::inline` does here too for a function marked `always_inline` at every level. What is accepted is a variadic definition nothing is emitted for, which is what GNU's `extern inline` gives and is where every use of it in glibc is, so a program compiled with `_FORTIFY_SOURCE` calls `__sprintf_chk` the way it does under gcc. gcc also takes it in a `static inline` function marked `always_inline`, which is still refused here. A copy that some call could not be inlined into becomes a declaration, so the call goes to the library. The signature is a fiction for the type checker, since this is not a function and has no type."

[[feature]]
name = "__builtin_va_arg_pack_len"
kind = "builtin"
gcc_version = "4.3"
status = "partial"
signature = "int(void)"
used_by = ["glibc"]
tests = ["rucc-sema::the_argument_pack_stands_only_where_nothing_is_emitted_for_the_function_around_it", "rucc-opt::a_pack_length_is_the_count_of_the_anonymous_arguments"]
notes = "How many anonymous arguments the function around it was handed, which glibc's `open` wrapper tests to catch a mode argument that is missing or a third argument that should not be there. Accepted in the same one place as `__builtin_va_arg_pack` and refused in the same way everywhere else, and `rucc_opt::inline` puts the count in its place when it inlines the function."

# The library builtins, the family where the answer is the library function of the same name
# with the prefix taken off. A program writes `__builtin_memcpy` rather than `memcpy` to reach
# the function the C library promises even where a macro or a definition of its own has taken
# the plain name, and to say that the usual meaning is the one intended so that the compiler may
# fold the call. Folding is an optimization on top of the call and not instead of it, so a
# `library` here says what the call means and nothing about how good the code for it is.
#
# What each of these needs is a declaration and a name to put on the call, both of which are on
# this row, so the rows below carry a `library` and are implemented. The ones that are not here
# are the ones that need more than that: the classification family wants a comparison rather than
# a call, and the stdio functions that take a `FILE *` cannot have their type written in the words
# a signature is made of. The `_chk` variants follow the same rule and have a section of their own
# below only because what they mean takes a paragraph of its own to say.

[[feature]]
name = "__builtin_abort"
kind = "builtin"
gcc_version = "2.0"
status = "implemented"
signature = "void(void)"
library = "abort"
used_by = ["linux", "glibc", "sqlite"]
tests = ["rucc-sema::every_library_builtin_is_declared_under_its_own_name_and_called_by_the_library_one", "rucc-driver::a_call_to_a_library_builtin_reaches_the_library_function"]
notes = "Two fifths of the files in the gcc torture suite call this, most of them nothing else out of the library, because it is what a test that has found a wrong answer does."

