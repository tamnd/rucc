[[feature]]
name = "counted_by"
kind = "attribute"
gcc_version = "15.0"
status = "implemented"
used_by = ["linux"]
tests = ["rucc/tests/annotations.rs"]
notes = "Checked with gcc 15's rules and messages: on a flexible array member only, naming an integer member of the same structure. `__builtin_counted_by_ref` reads it. `__builtin_dynamic_object_size` does not yet, so a fortified copy into the array is checked against what the layout says rather than against the count, which is the answer an unannotated array gets."

[[feature]]
name = "fallthrough"
kind = "attribute"
gcc_version = "7.0"
status = "implemented"
used_by = ["linux", "systemd", "ffmpeg"]
tests = ["tests/accept/attributes-that-ask-for-nothing-this-compiler-does.c", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them"]
notes = "A null statement in front of a case label that tells `-Wimplicit-fallthrough` the fall is meant. This compiler does not give that warning, so taking the statement is the whole of it. `__has_attribute` answers 202311, the number gcc 16 gives `[[fallthrough]]`, because gcc answers that for the GNU spelling as well."

[[feature]]
name = "assume_aligned"
kind = "attribute"
gcc_version = "4.9"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::the_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Says the pointer returned is aligned, which gcc may use to pick an aligned instruction. Dropping it only gives up that choice."

[[feature]]
name = "vector_size"
kind = "attribute"
gcc_version = "3.1"
status = "implemented"
used_by = ["ffmpeg", "openssl"]
tests = ["rucc-driver::the_vector_size_attribute_builds_a_type_of_lanes_and_measures_it_in_bytes", "tests/golden/vectors.c"]
notes = "The type and its operators are here and the lanes are computed one at a time, which is correct and is not the instruction the machine has. A vector in a register is `tamnd/rucc#200`, and so is passing one where the psABI puts it rather than as the lanes it is made of."

[[feature]]
name = "may_alias"
kind = "attribute"
gcc_version = "3.3"
status = "implemented"
used_by = ["ffmpeg", "glibc"]
tests = ["rucc-lower::a_typedef_that_may_alias_anything_is_the_root_and_its_type_is_not", "rucc::a_store_through_a_typedef_that_may_alias_carries_the_character_node", "rucc::the_attribute_after_the_typedef_name_says_the_same", "rucc::a_member_of_a_record_that_may_alias_carries_the_character_node"]
notes = "On a typedef or a record. An access through the type, or to a member of the record, carries the character type's aliasing node, so strict aliasing never separates it from anything. A vector or an aggregate had no node to begin with, so the cases that changed are a scalar typedef and a member."

[[feature]]
name = "designated_init"
kind = "attribute"
gcc_version = "5.1"
status = "implemented"
used_by = ["linux"]
tests = ["rucc::the_hints_gcc_answers_yes_for_are_taken_without_a_word", "rucc::a_designated_init_structure_given_a_value_by_position_is_said_by_default"]
notes = "A value an initializer list gives a member of a marked structure by position is said at the value, by default and under `-Wdesignated-init`, in gcc's words, `{0}` included and `{}` not. The kernel writes it on its operation tables through `__designated_init`."

[[feature]]
name = "common"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = []
tests = ["rucc::common_puts_a_tentative_definition_in_the_common_block_under_fno_common", "rucc::common_and_nocommon_together_keep_the_one_gcc_applies_first"]
notes = "A tentative definition written `common` goes in the common block under `-fno-common`, and the last declaration of the name that is not `extern` says whether it does, as in gcc 13. `weak`, `section` and an initializer keep it out. Written with `nocommon`, the one gcc applies first stands and the other is ignored with its warning. A `static` one stays in `.bss`, which links the same as gcc's local common block. One difference from gcc: a thread-local object is still defined, where gcc puts it in `.tls_common`."

[[feature]]
name = "nocommon"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::nocommon_keeps_a_tentative_definition_out_of_the_common_block_under_fcommon", "rucc::common_and_nocommon_together_keep_the_one_gcc_applies_first"]
notes = "A tentative definition written `nocommon` is an ordinary definition under `-fcommon`, where the others go in the common block."

[[feature]]
name = "tls_model"
kind = "attribute"
gcc_version = "3.3"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::tls_model_is_checked_the_way_gcc_checks_it", "rucc::a_thread_local_written_initial_exec_is_reached_through_the_initial_exec_sequence"]
notes = "Every thread-local variable is reached through the initial exec sequence, which is what glibc asks for with `attribute_tls_model_ie` and is right wherever `local-exec` is. A variable written with one of the two dynamic models is reached the same way, since the `__tls_get_addr` sequence is not written for any variable yet (issue #1104). Checked as gcc 13 checks it, in its words: the argument count and the string are errors (E0814), and the attribute on anything but a thread-local variable is dropped with a warning (E0703)."

[[feature]]
name = "nonstring"
kind = "attribute"
gcc_version = "8.0"
status = "implemented"
used_by = ["linux"]
tests = ["tests/accept/attributes-that-ask-for-nothing-this-compiler-does.c", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them"]
notes = "Says an array of characters need not hold a terminated string, which is only ever read by the warnings about truncating copies. This compiler gives none of them."

[[feature]]
name = "uninitialized"
kind = "attribute"
gcc_version = "12.0"
status = "implemented"
used_by = ["linux"]
tests = ["tests/accept/attributes-that-ask-for-nothing-this-compiler-does.c", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them"]
notes = "Leaves a local out of `-ftrivial-auto-var-init`, so it holds whatever was there, as in gcc."

[[feature]]
name = "copy"
kind = "attribute"
gcc_version = "9.0"
status = "implemented"
used_by = ["linux"]
tests = ["rucc::a_copy_takes_the_section_alignment_and_used_and_not_the_linkage", "tests/accept/a-copy-of-a-name-nothing-declared.c", "tests/accept/a-copy-with-two-arguments.c"]
notes = "Copies onto a declaration what gcc 16 copies from the one named: the section, the alignment, `used` and `retain`, `noreturn` and `returns_twice`, and the inlining and code generation flags such as `noinline`, `cold` and `hot`. What is about the name rather than the thing stays behind, as in gcc: `weak`, `visibility`, `alias`, `deprecated`, `always_inline` and `gnu_inline`. What the declaration writes itself stands over what it copies. The argument has to be a name declared above; gcc also takes an expression and copies from its type, which nobody writes and which is refused here. The kernel writes it on the aliases `module_init` makes."

[[feature]]
name = "alloc_size"
kind = "attribute"
gcc_version = "4.3"
status = "implemented"
used_by = ["linux", "glibc"]
tests = ["rucc-opt::what_an_allocator_gave_back_is_what_its_alloc_size_says", "rucc-ir::an_alloc_size_comes_back_byte_for_byte", "rucc::an_alloc_size_answers_the_object_size_of_what_the_call_returned", "tests/accept/an-alloc-size-past-the-parameters.c"]
notes = "Tells `__builtin_object_size` how big the object a call returns is, as the product of the one or two arguments it names. As in gcc 16, the answer comes from `-O1` up and only through a variable the result was put in, since the operand of the builtin is not evaluated, and at `-O0` it is not known. With constant arguments both builtins answer the constant, less any constant offset on the pointer. `__builtin_dynamic_object_size` over a call whose arguments are not constants is answered at run time from those arguments where they are as wide as `size_t`, which `malloc` and `kmalloc` are, and the address is the result with constant offsets on it; anything else is not known, which is the safe answer. Bad arguments are dropped with gcc's warnings."

[[feature]]
name = "cdecl"
kind = "attribute"
gcc_version = "2.95"
status = "implemented"
targets = ["x86-64", "x86"]
used_by = ["mingw-w64"]
tests = ["rucc::the_32_bit_conventions_warn_on_linux_and_are_silent_on_windows", "rucc-pp::the_answers_for_the_x86_and_windows_attributes_are_the_targets"]
notes = "Read by the checker, which drops it with gcc's warning on x86-64 outside Windows and quietly on Windows, as gcc does. On 32-bit x86 it names the convention every function has already, so taking it and doing nothing is the whole implementation. `__has_attribute` answers yes on every x86 target, as gcc 16 does, and no on the others, where gcc does not know the name."

[[feature]]
name = "stdcall"
kind = "attribute"
gcc_version = "2.95"
status = "implemented"
targets = ["x86-64"]
used_by = ["mingw-w64"]
tests = ["rucc::the_32_bit_conventions_warn_on_linux_and_are_silent_on_windows", "rucc-pp::the_answers_for_the_x86_and_windows_attributes_are_the_targets"]
notes = "Read by the checker, which drops it with gcc's warning on x86-64 outside Windows and quietly on Windows, as gcc does, since a 64-bit program has one convention and the headers write these for the sake of the 32-bit build. `__has_attribute` answers yes on x86-64 and no everywhere else. gcc 16 answers yes on 32-bit x86 as well, where the attribute changes how the call is made, and this compiler does not make the call that way yet, so the row names x86-64 alone until it does, which is tamnd/rucc#2534."

[[feature]]
name = "fastcall"
kind = "attribute"
gcc_version = "3.4"
status = "implemented"
targets = ["x86-64"]
used_by = ["mingw-w64"]
tests = ["rucc::the_32_bit_conventions_warn_on_linux_and_are_silent_on_windows", "rucc-pp::the_answers_for_the_x86_and_windows_attributes_are_the_targets"]
notes = "Read by the checker, which drops it with gcc's warning on x86-64 outside Windows and quietly on Windows, as gcc does, since a 64-bit program has one convention and the headers write these for the sake of the 32-bit build. `__has_attribute` answers yes on x86-64 and no everywhere else. gcc 16 answers yes on 32-bit x86 as well, where the attribute changes how the call is made, and this compiler does not make the call that way yet, so the row names x86-64 alone until it does, which is tamnd/rucc#2534."

[[feature]]
name = "thiscall"
kind = "attribute"
gcc_version = "4.6"
status = "implemented"
targets = ["x86-64"]
used_by = ["mingw-w64"]
tests = ["rucc::the_32_bit_conventions_warn_on_linux_and_are_silent_on_windows", "rucc-pp::the_answers_for_the_x86_and_windows_attributes_are_the_targets"]
notes = "Read by the checker, which drops it with gcc's warning on x86-64 outside Windows and quietly on Windows, as gcc does, since a 64-bit program has one convention and the headers write these for the sake of the 32-bit build. `__has_attribute` answers yes on x86-64 and no everywhere else. gcc 16 answers yes on 32-bit x86 as well, where the attribute changes how the call is made, and this compiler does not make the call that way yet, so the row names x86-64 alone until it does, which is tamnd/rucc#2534."

[[feature]]
name = "regparm"
kind = "attribute"
gcc_version = "2.95"
status = "implemented"
targets = ["x86-64", "x86"]
used_by = ["mingw-w64"]
tests = ["rucc::the_32_bit_conventions_warn_on_linux_and_are_silent_on_windows", "rucc::three_registers_carry_the_first_three_words", "rucc::asmlinkage_and_variadic_functions_take_the_stack", "rucc-pp::the_answers_for_the_x86_and_windows_attributes_are_the_targets"]
notes = "On 32-bit x86 outside Windows the first n words of the arguments go in `eax`, `edx` and `ecx` the way gcc puts them there, structures of up to n words and the address of a returned structure included, and a variadic function takes everything on the stack whatever it says. `-mregparm=` sets the count for the whole unit and the attribute changes it for one function, which is how the kernel has `asmlinkage` be `regparm(0)`. On x86-64 outside Windows it is dropped with gcc's warning, and on Windows it is dropped quietly, which on 32-bit Windows is still short of gcc and is tamnd/rucc#2534. `__has_attribute` answers yes on x86 and x86-64."

[[feature]]
name = "vectorcall"
kind = "attribute"
gcc_version = "none"
status = "partial"
used_by = ["mingw-w64"]
tests = ["rucc::the_32_bit_conventions_warn_on_linux_and_are_silent_on_windows"]
notes = "Clang's and Microsoft's rather than gcc's, which does not know it. Read by the checker alongside the 32-bit conventions and dropped the way they are, and `__has_attribute` answers no, which is gcc's answer."

[[feature]]
name = "ms_struct"
kind = "attribute"
gcc_version = "3.4"
status = "implemented"
targets = ["x86-64", "x86", "windows"]
used_by = ["mingw-w64"]
tests = ["rucc-driver::ms_struct_and_gcc_struct_choose_the_bit_field_rule_for_one_record", "rucc-pp::the_answers_for_the_x86_and_windows_attributes_are_the_targets"]
notes = "Lays the bit-fields of one record out the way Microsoft's compiler does, on x86 and on Windows, which is where gcc takes it. `__has_attribute` answers yes on those targets and no on the others, which is gcc 16's answer on x86-64 Linux and with `-m32` and mingw-w64 gcc's and AArch64 gcc's."

[[feature]]
name = "gcc_struct"
kind = "attribute"
gcc_version = "3.4"
status = "implemented"
targets = ["x86-64", "x86", "windows"]
used_by = ["mingw-w64"]
