[[feature]]
name = "naked"
kind = "attribute"
gcc_version = "4.7"
status = "implemented"
used_by = ["linux", "micropython"]
tests = ["rucc-sema::naked_written_as_the_attribute_is_kept", "rucc-driver::a_naked_function_is_its_own_prologue_and_its_own_ending"]
notes = "Nothing is written around the body. No prologue, so no register the convention preserves is put away and no bytes are taken, which is what micropython's `nlr_push` needs: its first instruction reads the return address out of `(%rsp)` and a push in front of it would have moved the address somewhere else. No epilogue, so the `ret` a function usually ends with is not written either, and falling off the end becomes the `ud2` gcc puts in the same place. The stack protector is left out of one whatever the command line asked, since the canary is a word the prologue writes and the check at the end reads back. A naked function whose frame comes out with any bytes in it is refused rather than given offsets into a frame nothing set up, and so is one with a variable length array in it."

[[feature]]
name = "ms_abi"
kind = "attribute"
gcc_version = "4.4"
status = "implemented"
targets = ["x86-64", "x86"]
used_by = ["edk2", "gnu-efi", "wine"]
tests = ["rucc-types::two_conventions_are_two_incompatible_types", "rucc-pp::the_calling_convention_attributes_are_there_on_x86_alone", "rucc/tests/conventions.rs", "tests/exec/linux/ms_abi.c"]
notes = "A function of the Windows x64 convention on an x86-64 target that is not Windows, which is what `EFIAPI` is on Linux. It is part of the function type, as it is to gcc: written in the specifiers, after the declarator or beside the star of a pointer, and kept through a typedef, so `typedef EFI_STATUS (EFIAPI *F)(...)` is a pointer to an `ms_abi` function. A declaration each way is `conflicting types` and a pointer of one assigned to a pointer of the other is an incompatible pointer. On Windows it names the target's own convention and changes nothing. A call and a definition use the Windows registers, shadow space and preserved set, and a function of the one calling a function of the other keeps what the callee does not. Calling a variadic one works. Defining one is refused with `E0741`, since its body would need the Windows `va_list`. On a target other than x86-64 it is ignored with a warning and `__has_attribute` answers nought."

[[feature]]
name = "sysv_abi"
kind = "attribute"
gcc_version = "4.4"
status = "implemented"
targets = ["x86-64", "x86"]
used_by = ["wine"]
tests = ["rucc-types::two_conventions_are_two_incompatible_types", "rucc-pp::the_calling_convention_attributes_are_there_on_x86_alone", "rucc/tests/conventions.rs", "tests/exec/windows/sysv_abi.c"]
notes = "The mirror of `ms_abi`: a function of the System V convention on Windows, read and kept the same way. On x86-64 targets other than Windows it names the target's own convention and changes nothing. Writing it with `ms_abi` on the same declaration is refused with `E0740`, in gcc's words. A variadic definition is refused with `E0741`. The unwind record is still written for one, which gcc leaves out, since a function of either convention on Windows is unwound by the same reader."

[[feature]]
name = "mode"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["glibc"]
tests = ["tests/accept/a-type-in-a-machine-mode.c", "tests/accept/a-vector-written-as-a-machine-mode.c", "tests/accept/a-machine-mode-that-does-not-exist.c", "tests/accept/a-machine-mode-of-the-wrong-class.c"]

[[feature]]
name = "transparent_union"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["glibc"]
tests = ["tests/golden/transparent-union.c", "tests/accept/a-transparent-union-that-is-a-struct.c"]
notes = "On a union, in both places gcc takes it: after the closing brace and on the declarator of the typedef, which is where glibc writes it. A parameter of the union type is compatible with a parameter of any member's type, and a value assigned to one goes into whichever member it fits, which is the same object a cast to a union builds. Dropped with a warning on anything that is not a union and on a union that is not the size and the alignment of its first member, which is gcc's own rule and its own answer to breaking it."

[[feature]]
name = "noreturn"
kind = "attribute"
gcc_version = "2.5"
status = "implemented"
used_by = ["linux", "glibc", "sqlite", "systemd"]
tests = ["rucc-sema::noreturn_written_as_the_attribute_is_kept", "tests/golden/gnu.c", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them"]
notes = "The claim reaches the IR as `attrs(noreturn)` on the function, and `_Noreturn` and `[[noreturn]]` land in the same place. The code is right without anything acting on it, since a call that does come back is undefined and the block after one is simply never reached. What gcc also does with it is take that block away, which is the optimization in tamnd/rucc#712 and is not a reason to send a header down its fallback path."

[[feature]]
name = "always_inline"
kind = "attribute"
gcc_version = "3.1"
status = "implemented"
used_by = ["linux", "glibc", "ffmpeg"]
tests = ["rucc::a_fortified_wrapper_forwards_its_arguments", "rucc-opt::a_call_to_an_always_inline_function_is_replaced_by_its_body", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them"]
notes = "Every direct call is inlined at every level, `-O0` included, by `rucc_opt::inline`, which settles each callee before its callers and leaves a call inside a cycle alone. A call it refuses, which is one to a function that takes a structure by value, calls `va_start`, takes a label's address or calls `setjmp`, stays a call and is reported as missed under `-fopt-info`, where gcc gives an error."

[[feature]]
name = "gnu_inline"
kind = "attribute"
gcc_version = "4.1"
status = "implemented"
used_by = ["linux", "glibc"]
tests = ["rucc-sema::gnu_inline_reads_the_two_words_the_other_way_round", "tests/golden/gnu.c"]
notes = "Which of the two readings of `inline` the name is under, and so whether a definition of it is emitted. The reading is a fact about the name, so the attribute reaches the declarations already read, which is the order the C library writes its headers in."

[[feature]]
name = "noinline"
kind = "attribute"
gcc_version = "3.1"
status = "implemented"
used_by = ["linux", "glibc"]
tests = ["rucc::a_fortified_wrapper_forwards_its_arguments"]
notes = "Read and carried to the IR as an attribute of the function. The only inliner so far is the one for `always_inline`, which never inlines anything else, so nothing here inlines a `noinline` function. A name that says both is under `always_inline`, as it is under gcc."

[[feature]]
name = "noclone"
kind = "attribute"
gcc_version = "4.5"
status = "implemented"
used_by = ["linux"]
tests = ["tests/accept/attributes-that-ask-for-nothing-this-compiler-does.c", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them"]
notes = "Says gcc may not make a specialised copy of the function. This compiler never makes one, so the promise is kept by doing nothing."

[[feature]]
name = "noipa"
kind = "attribute"
gcc_version = "8.0"
status = "implemented"
used_by = ["gcc-torture", "glibc"]
tests = ["rucc::noipa_keeps_every_call_to_the_function_a_call"]
notes = "Nothing about a call to the function is decided from its body: it is not inlined, `always_inline` beside it included, no constant or range goes into its parameters or comes back as its answer, and what its body does to memory, purity and its parameters is not used at a call. The call graph treats the body as one it may not trust, which is the gate interposition goes through, so every pass that reads another function's body is held off by the one test. There is no interprocedural register allocation to turn off. One difference from gcc: a `noipa` written on something other than a function, or with an argument, is taken without gcc's warning or error, as `noinline` is."

[[feature]]
name = "flatten"
kind = "attribute"
gcc_version = "4.1"
status = "implemented"
used_by = ["systemd"]
tests = ["rucc::the_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Asks for every call in the function to be inlined where it can be. It is only a hint and is dropped, so the calls are inlined when the inliner would have inlined them anyway, and the program is the same."

[[feature]]
name = "hot"
kind = "attribute"
gcc_version = "4.3"
status = "implemented"
used_by = ["linux"]
tests = ["rucc-sema::cold_and_hot_written_as_attributes_are_kept"]
notes = "It reaches the IR as `attrs(hot)`. Nothing acts on it yet. It is only a hint, so the program is the same without it."

[[feature]]
name = "cold"
kind = "attribute"
gcc_version = "4.3"
status = "implemented"
used_by = ["linux", "systemd"]
tests = ["rucc-sema::cold_and_hot_written_as_attributes_are_kept"]
notes = "It reaches the IR as `attrs(cold)`, and `rucc_opt::predict` makes the path to a call of a cold function the unlikely one. Postgres marks `errstart_cold` with it so the error path of every `elog` is laid out away from the hot code."

[[feature]]
name = "pure"
kind = "attribute"
gcc_version = "2.96"
status = "implemented"
used_by = ["linux", "glibc", "curl"]
tests = ["rucc-sema::pure_written_as_the_attribute_is_kept", "tests/golden/gnu.c"]
notes = "The promise reaches the IR as `attrs(readonly)` on the function, from either place an attribute can go on a declaration, and the purity analysis reads it there. Two calls to one with the same arguments and no write in between are one call, and a call to one nothing reads is deleted when it also terminates."

[[feature]]
name = "const"
kind = "attribute"
gcc_version = "2.5"
status = "implemented"
used_by = ["linux", "glibc"]
tests = ["rucc-sema::const_written_as_the_attribute_is_kept", "tests/golden/gnu.c"]
notes = "The stronger of the pair, reaching the IR as `attrs(readnone)`. A declaration is where it has to be read, because the function it is written about is usually defined in another file and the analysis that works purity out from a body has nothing to look at."

[[feature]]
name = "malloc"
kind = "attribute"
gcc_version = "2.96"
status = "implemented"
used_by = ["glibc", "systemd"]
tests = ["rucc::the_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Both forms: the plain one, which says the pointer returned aliases nothing, and `malloc(deallocator, index)`, which names the function that frees it for the analyzer. Both are dropped, which gives up an aliasing fact and a warning and changes nothing a correct program does."

[[feature]]
name = "returns_twice"
kind = "attribute"
gcc_version = "4.1"
status = "implemented"
used_by = ["glibc", "postgres"]
tests = ["rucc-sema::returns_twice_written_as_the_attribute_is_kept", "rucc-driver::a_value_live_across_a_returns_twice_call_keeps_its_spill_slot"]
notes = "`setjmp` is declared with it. A function that calls one lays out its frame with no two values sharing a stack slot and makes no tail call, which is what the known names `setjmp`, `sigsetjmp`, `savectx`, `vfork` and `getcontext` already got. The register side needs nothing, since `longjmp` puts back the callee saved registers the `setjmp` wrote down."

[[feature]]
name = "no_instrument_function"
kind = "attribute"
gcc_version = "2.95"
status = "implemented"
used_by = ["linux"]
tests = ["rucc-sema::no_instrument_function_written_as_the_attribute_is_kept", "rucc-driver::instrumenting_functions_calls_the_hooks_around_every_body_but_the_hooks"]
notes = "Takes a function back out of `-finstrument-functions`, which is what the two hooks need or they call themselves. One declaration saying it is enough, so a prototype that says it covers the definition below."

[[feature]]
name = "no_profile_instrument_function"
kind = "attribute"
gcc_version = "7.0"
status = "implemented"
used_by = ["linux"]
tests = ["tests/accept/attributes-that-ask-for-nothing-this-compiler-does.c", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them", "arc_counters::a_counted_program_hands_its_counts_to_gcov_init"]
notes = "Takes a function out of the counters `-fprofile-arcs` adds, which is what the runtime that reads them needs or it counts itself."

[[feature]]
name = "no_stack_protector"
kind = "attribute"
gcc_version = "11.0"
status = "implemented"
used_by = ["linux"]
tests = ["rucc::a_function_that_says_no_stack_protector_gets_none_under_any_flag", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them"]
notes = "The kernel writes it on the code that runs before the canary is set up, where a check on the way out would fail in a function that did nothing wrong. Read on any declaration of the name and wins over every `-fstack-protector` flag."

[[feature]]
name = "no_split_stack"
kind = "attribute"
gcc_version = "4.6"
status = "implemented"
used_by = []
tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Takes a function out of `-fsplit-stack`, which this compiler does not have, so every function already keeps the one stack it was called on."

[[feature]]
name = "no_stack_limit"
kind = "attribute"
gcc_version = "4.2"
status = "implemented"
used_by = []
tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Takes a function out of `-fstack-limit-register=` and `-fstack-limit-symbol=`, which this compiler does not have, so no function checks a limit."

[[feature]]
name = "function_return"
kind = "attribute"
gcc_version = "8.0"
status = "implemented"
used_by = ["linux"]
tests = ["rucc::a_function_that_says_keep_is_left_as_it_was"]
notes = "x86-64. `function_return` with the argument keep leaves a function's returns as `ret` under `-mfunction-return=thunk-extern`, which the kernel needs on code that runs before the return thunk can. The other values ask for a thunk on a function the command line left alone, which the kernel never writes, and are read as nothing."

[[feature]]
name = "indirect_branch"
kind = "attribute"
gcc_version = "8.0"
status = "implemented"
used_by = ["linux"]
tests = ["rucc::a_function_that_says_keep_is_left_as_it_was"]
notes = "x86-64. `indirect_branch` with the argument keep leaves a function's indirect calls and jumps as they are under `-mindirect-branch=thunk-extern`. The other values are read as nothing, as for `function_return`."

[[feature]]
name = "stack_protect"
kind = "attribute"
gcc_version = "4.9"
status = "implemented"
used_by = ["linux"]
tests = ["rucc::a_function_that_says_stack_protect_gets_one_whenever_protection_is_on"]
notes = "A canary under any `-fstack-protector` flag whatever the function's locals are, and the only functions `-fstack-protector-explicit` protects. Nothing under `-fno-stack-protector`. Of this and `no_stack_protector` on one function the one written first stands, as in gcc 13."

[[feature]]
name = "zero_call_used_regs"
kind = "attribute"
gcc_version = "11.0"
status = "implemented"
used_by = ["linux"]
tests = ["rucc::a_function_that_names_a_choice_gets_that_choice", "rucc::every_choice_of_the_attribute_is_taken", "rucc::used_clears_the_vector_registers_and_the_x87_stack_like_gcc_16", "rucc::all_clears_every_register_in_the_order_gcc_16_does", "rucc::all_uses_vzeroall_and_clears_the_avx_512_registers_like_gcc_16", "rucc::all_clears_the_vector_registers_on_aarch64_like_gcc"]
notes = "x86-64 and AArch64. Replaces `-fzero-call-used-regs=` for one function, and every choice gcc 16 has is taken. The choices without `-gpr` clear the vector registers too, with `pxor`, `vxorps`, or `vzeroall` when all sixteen go, and on x86-64 `used` and `all` clear the x87 stack with `fldz` and `fstp`, as gcc 16 does. With AVX-512 `all` clears `zmm16` to `zmm31` and the mask registers as well. On AArch64 the vector registers are `v0` to `v7` and `v16` to `v31`; `x18` stays the platform's, and the SVE registers are not cleared, since rucc has no SVE."

[[feature]]
name = "no_caller_saved_registers"
kind = "attribute"
gcc_version = "7.0"
status = "implemented"
answer = "error"
used_by = ["linux"]
tests = ["rucc::a_function_that_saves_every_register_puts_back_what_it_writes", "rucc::a_function_that_saves_every_register_and_calls_saves_every_caller_saved_one"]
notes = "x86-64 only, as with gcc, and refused with E0753 on every other target rather than ignored. The function saves every general purpose register it writes, the ones a callee may usually write included, except the one its value comes back in, and a call in it saves all of them since the callee may write any. No tail call is made out of one. The vector registers and the x87 stack are not saved, which is gcc's answer too: a function of this kind that would use one is refused with E0786 unless `-mgeneral-regs-only` or a `target` attribute took them away."

[[feature]]
name = "target"
kind = "attribute"
gcc_version = "4.4"
status = "implemented"
used_by = ["ffmpeg", "openssl", "linux", "postgres"]
tests = ["rucc-driver::a_function_built_for_sse4_2_calls_the_steps_without_a_flag", "rucc-driver::the_shipped_smmintrin_refuses_a_caller_not_built_for_the_checksum", "rucc-driver::a_target_string_gcc_does_not_know_is_refused", "rucc-driver::an_aarch64_target_string_is_still_accepted", "rucc-opt::a_callee_built_for_more_than_its_caller_stays_a_call", "rucc-target::an_attribute_string_gcc_refuses_is_refused_the_same_way", "rucc::a_target_line_reaches_the_functions_after_it_until_it_is_popped", "rucc::a_target_gcc_does_not_know_is_refused_once"]
notes = "On x86-64 the strings are read the way gcc 16 reads them: a comma separated list of extension names with or without `no-`, `arch=`, `tune=`, `fpmath=`, `prefer-vector-width=` and gcc's handful of plain options, with a name gcc does not know refused in gcc's words. The function is built for the unit's extensions and what the attribute adds, and that decides two things. A call to an `always_inline` function built for more than its caller is refused with gcc's `target specific option mismatch`, which is what lets the shipped intrinsics be called from a function whose attribute names `sse4.2` in a unit built for the baseline, and the inliner never copies a body built for more into a caller built for less. The code generator does not yet choose instructions by it, so `__builtin_popcount` in a function whose attribute names `popcnt` is still the portable sequence, and `arch=` is only understood for the psABI level names. `#pragma GCC target` is read as this attribute on every function declared while it is in effect, its strings ahead of the attribute's. Beside `target_clones` it is dropped with gcc's warning. Every other target's strings, AArch64's `+crc` among them, are accepted and change nothing."

[[feature]]
name = "target_clones"
kind = "attribute"
gcc_version = "6.0"
status = "implemented"
targets = ["x86-64-elf"]
used_by = ["glibc"]
tests = ["rucc::every_version_is_built_with_a_resolver_and_an_indirect_function", "rucc::the_resolver_picks_the_version_the_processor_runs_best", "rucc::the_last_declaration_names_the_versions", "rucc::what_gcc_refuses_is_refused_in_its_words", "rucc::what_gcc_drops_is_dropped_with_its_warning", "rucc::a_target_without_indirect_functions_refuses_it", "rucc::has_attribute_answers_yes_only_where_it_is_built"]
notes = "On x86-64 ELF, built the way gcc 16 builds it: a local function `f.<suffix>` for each version, `f.avx2` and `f.arch_x86_64_v3` and `f.default`, a resolver `f.resolver` that calls `__cpu_indicator_init` and picks the first version in gcc's priority order whose bit libgcc set, weak for an external function and local for a `static` one, and `f` itself an indirect function bound to it. The versions are the twenty extensions gcc dispatches on and the four psABI levels, strings are split on commas, a name written twice is built once and the last declaration's list stands. What gcc refuses is refused in its words with E0805 and what it drops, one name alone, a `target` or `always_inline` beside it, the attribute on an object, is dropped with its warnings under `-Wattributes`. `arch=` naming a processor rather than a level is refused with E0806, and every other target with E0807, Windows and macOS in gcc's words since neither has indirect functions, and `__has_attribute` answers no there. The code generator does not choose instructions by extension yet, so the versions are the same code and differ in what the inliner may copy into them."

[[feature]]
name = "optimize"
kind = "attribute"
gcc_version = "4.4"
status = "implemented"
used_by = ["linux"]
tests = ["rucc::an_inlined_body_keeps_the_aliasing_it_asked_for", "rucc::an_optimize_attribute_that_turns_the_protector_off_is_read_as_the_attribute", "rucc::a_function_that_asks_for_o0_is_compiled_at_o0", "rucc::a_function_that_asks_for_wrapv_wraps", "rucc::a_function_that_asks_for_its_loops_keeps_them", "rucc::an_optimize_line_reaches_the_functions_after_it"]
notes = "Every option that changes what a program means is honoured, each spelled with or without the leading `-` or `-f`. `O0`, or `optimize (0)`, holds the one function to `-O0` whatever the unit is built at, which is the level a function can be held to on its own since the `-O0` passes are a subset of every other level's: the function is marked `optnone`, so nothing is inlined into it or out of it, the pass list skips every pass `-O0` does not run for it, the interprocedural constant propagation and parameter removal leave it alone, no library call in it is folded, and `__builtin_constant_p` and `__builtin_object_size` in it are answered the way `-O0` answers them. `no-strict-aliasing` lowers the function's accesses with no aliasing node, which matters once the body is inlined into a function under the rule, as `gcc.c-torture/execute/pr79043.c` does. `wrapv` lowers its signed arithmetic as `-fwrapv` would, which holds after inlining for the same reason. `no-tree-loop-distribute-patterns` keeps the function's loops loops, and a caller its body is inlined into keeps its own as well, which is what a freestanding `memset` under another name needs. `no-delete-null-pointer-checks` needs nothing since no pass deletes a null check. `no-stack-protector` is read as the `no_stack_protector` attribute, which is what the kernel's `__nostackprotector` was before gcc 11. Every other level and option is accepted and ignored, and none of those changes what the program does: a level above `-O0` and the code generator's choices such as `no-omit-frame-pointer` are the unit's for every function. `#pragma GCC optimize` is read as this attribute on every function declared while it is in effect, with the function's own attribute winning where the two disagree."

[[feature]]
name = "interrupt"
kind = "attribute"
gcc_version = "4.3"
status = "implemented"
answer = "error"
used_by = ["linux"]
tests = ["rucc::an_interrupt_handler_returns_with_iretq", "rucc::an_interrupt_handler_with_an_error_code_takes_it_off_before_returning", "rucc::an_interrupt_handler_that_calls_clears_the_direction_flag", "rucc::an_interrupt_handler_is_checked_the_way_gcc_checks_it", "rucc::an_interrupt_handler_is_refused_on_a_target_without_one"]
notes = "x86-64 only, as with gcc, and refused with E0753 on every other target rather than ignored. The handler takes a pointer to the interrupt frame and optionally a word sized integer error code, returns `void`, saves every register it writes, has no red zone, clears the direction flag before it calls anything and returns with `iretq`, taking the error code off the stack first when it had one. A wrong signature, `naked` on one and a direct call to one are E0785 with gcc's wording, and one that would use the vector registers or the x87 stack is E0786, as gcc's sorry is."

[[feature]]
name = "used"
kind = "attribute"
gcc_version = "3.1"
status = "implemented"
answer = "error"
used_by = ["linux", "systemd"]
tests = ["rucc-driver::an_attribute_keeps_a_static_function_nothing_refers_to"]
notes = "It is what keeps a symbol the linker script needs from being dropped, and emitting a definition nothing refers to is the whole of what it asks for."

[[feature]]
name = "unused"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["linux", "glibc", "systemd"]
tests = ["tests/accept/attributes-that-ask-for-nothing-this-compiler-does.c", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them"]
notes = "What it asks for is that the unused warnings keep quiet about the name, and this compiler gives none of them, so taking it and doing nothing is the whole of it. It becomes work the day `-Wunused-variable` does."

[[feature]]
name = "externally_visible"
kind = "attribute"
gcc_version = "4.2"
status = "implemented"
used_by = ["linux"]
tests = ["tests/accept/attributes-that-ask-for-nothing-this-compiler-does.c", "rucc-pp::the_kernel_s_compiler_attributes_are_answered_the_way_gcc_answers_them"]
notes = "Keeps a name visible when `-fwhole-program` or link-time optimization would otherwise make it local. This compiler does neither yet, `-flto` is read and not acted on, so every name with external linkage already stays visible. This row has to be looked at again when `-flto` starts doing something."

[[feature]]
name = "retain"
kind = "attribute"
gcc_version = "11.0"
status = "implemented"
used_by = ["linux"]
tests = ["rucc-driver::an_attribute_keeps_a_static_function_nothing_refers_to", "rucc::a_retained_definition_is_in_a_section_of_its_own_marked_r", "rucc::a_retained_section_has_the_flag_in_the_object"]
notes = "The compiler keeps the definition and the linker is asked to as well. It goes in a section of its own marked `SHF_GNU_RETAIN`, which `--gc-sections` does not take away: the one it would have gone in under `-ffunction-sections` or `-fdata-sections`, or the one the program named, with `R` added to the flags, as gcc 16 writes it. A tentative definition so marked is a zeroed one in `.bss.` and its name rather than a common symbol. Only ELF has the flag."

[[feature]]
name = "visibility"
kind = "attribute"
gcc_version = "3.3"
status = "implemented"
used_by = ["glibc", "systemd", "openssl", "curl"]
tests = ["rucc::the_attribute_a_declaration_wrote_reaches_the_listing", "rucc::a_declaration_that_asked_beats_the_flag_that_did_not_know_about_it"]
notes = "All four strings are taken and there are three answers, because `internal` is `hidden` plus a promise about never taking the address across a component boundary and nothing here derives anything from that promise. It reaches `st_other` in an object and `.hidden` or `.protected` in a listing, `.private_extern` on Mach-O, and nothing on COFF, which has no per symbol spelling of either. `-fvisibility=` is the same answer asked for on the command line, and the attribute wins where both are written."

[[feature]]
name = "weak"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["linux", "glibc", "musl"]
tests = ["rucc::a_definition_that_asked_to_lose_is_written_weak_rather_than_global", "rucc::a_hook_nobody_defines_is_declared_weak_rather_than_wanted", "rucc::a_static_name_has_nothing_to_give_way_to_and_is_told_so"]
notes = "Two things, and which one it is depends on whether this file defines the name. On a definition it says another object's definition beats this one, which is how a library ships a default somebody may replace, and it reaches the listing as `.weak` with a body under it and an object as a weak defined symbol. On a declaration of something this file does not define it says the link may leave the name undefined and hand every reference a zero address, which is how a library offers a hook a profiler may fill in, and it reaches the listing as `.weak` with nothing under it and an object as a weak undefined symbol. It is a fact about the name rather than about one declaration of it, so a header may say it and the definition below need not say it again. It is refused on internal linkage, where gcc refuses it too, since a name the linker never sees has nobody to lose to. One difference from gcc: the directive is written for every name a declaration marked, and gcc writes it only for the ones something in the file refers to, which is one undefined weak symbol more in a file that declares a hook and never calls it and is what keeps the listing and the object reading the same list."

[[feature]]
name = "alias"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["glibc", "musl"]
tests = ["rucc::a_second_name_reaches_the_same_object_the_first_one_does"]
notes = "The target has to be defined in the same file, which is GCC's rule as well. An alias of an alias is refused rather than written as a name pointing at a name."

[[feature]]
name = "weakref"
kind = "attribute"
gcc_version = "4.2"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::a_weakref_to_a_missing_symbol_is_a_weak_reference_to_it", "rucc::a_weakref_named_through_alias_is_the_same_reference", "rucc::a_weakref_beside_an_ordinary_use_is_an_ordinary_reference", "rucc::a_declaration_nothing_uses_leaves_the_weakref_weak", "rucc::a_weakref_to_something_the_file_defines_reaches_the_definition", "rucc::a_weakref_is_refused_where_gcc_refuses_it", "rucc::a_weakref_with_no_target_is_warned_about_and_left_ordinary", "rucc::a_weakref_is_refused_where_the_object_format_has_no_way_to_write_it"]
notes = "Both spellings, `weakref` with the target as its argument and `weakref` with the target given to `alias`. The target is a weak undefined symbol unless the file also refers to it by its own name, which makes it an ordinary one, or defines it, which makes it that definition, as the assembler does with gcc's `.weakref`. The name has to be `static` and is refused otherwise in gcc's words. ELF only: on COFF and Mach-O it is refused with E0753 rather than dropped. One difference from gcc: an object weakref nothing uses still leaves a weak undefined symbol behind, the way an unused `weak` declaration does."

[[feature]]
name = "cleanup"
kind = "attribute"
gcc_version = "3.4"
status = "implemented"
used_by = ["systemd", "linux", "glibc"]
tests = ["tests/golden/cleanup-attribute.c", "tests/accept/a-cleanup-on-an-object-that-outlives-its-block.c", "rucc::an_asm_goto_leaving_a_cleanup_handler_runs_it_on_the_way_to_the_label"]
notes = "Runs the handler on every way out of the block the object was declared in, which is the closing brace and every return, break, continue and goto that leaves it, in the reverse of the order the objects were declared. Not longjmp, which gcc does not promise either. An asm goto runs it on the edge to each label that leaves the block. A computed goto out of a block that owes one is turned down rather than built without the calls. The handler counts as a use of the function, which is what keeps a static inline one in the object file when the attribute is the only thing in the translation unit that names it."

[[feature]]
name = "constructor"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["glibc", "systemd", "openssl"]
tests = ["rucc::an_elf_file_gets_an_entry_in_each_of_the_two_arrays", "rucc::a_priority_goes_in_the_section_name_and_sorts_ahead_of_one_without", "rucc::a_windows_file_gets_an_entry_the_c_runtime_walks", "rucc::a_darwin_file_gets_an_entry_dyld_calls"]
notes = "An ELF file gets an `.init_array` entry, sorted by priority when one is given, a Windows file gets one in `.CRT$XCU`, and a Darwin file one in `__mod_init_func`."

[[feature]]
name = "destructor"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["glibc", "openssl"]
tests = ["rucc::an_elf_file_gets_an_entry_in_each_of_the_two_arrays", "rucc::a_windows_destructor_is_handed_to_atexit_from_a_constructor", "rucc::a_destructor_is_refused_on_darwin_which_has_nowhere_to_put_one"]
notes = "An ELF file gets a `.fini_array` entry and a Windows one is registered with `atexit` from a constructor. Darwin refuses it with an error, since there is no section dyld walks at exit, rather than dropping it."

[[feature]]
name = "deprecated"
kind = "attribute"
gcc_version = "3.1"
status = "implemented"
used_by = ["glibc", "openssl", "curl"]
tests = ["rucc::a_name_marked_deprecated_is_said_at_every_use_in_gcc_s_words", "rucc::a_deprecated_name_can_be_used_quietly_under_the_option_that_turns_it_off", "rucc::a_use_of_a_deprecated_type_tag_member_or_enumerator_is_warned_about_the_way_gcc_does", "rucc::a_deprecated_member_answers_to_wno_deprecated_declarations"]
notes = "A use of a function, an object, a typedef, a tag, a member or an enumerator marked with it is a warning in gcc's words under `-Wdeprecated-declarations`, with the message when one was given and a note at the declaration, except for a typedef, which gcc gives none."

[[feature]]
name = "unavailable"
kind = "attribute"
gcc_version = "12.0"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::a_name_marked_unavailable_is_refused_at_every_use_in_gcc_s_words"]
notes = "`deprecated` made an error: a use of a function, an object, a typedef, a tag, a member or an enumerator marked with it is refused in gcc's words, `'f' is unavailable` with the message when one was given and a note at the declaration, and no option turns it off. It outranks `deprecated` whichever came first, on one declaration or across several, and the message said is the last one `unavailable` gave. A definition after it is not a use. Under `-fgnuc-version=` before 12 it is an attribute gcc has not heard of. One difference from gcc: an argument that is not a string, or a second one, is taken without gcc's error, as for `deprecated`."

[[feature]]
name = "nocf_check"
kind = "attribute"
gcc_version = "8.0"
status = "implemented"
targets = ["x86-64", "x86"]
used_by = ["linux"]
tests = ["rucc-types::a_function_without_a_landing_pad_is_another_type", "rucc-types::a_function_without_a_landing_pad_says_so_in_front_of_the_star", "rucc::nocf_check_leaves_out_the_landing_pad_and_calls_through_a_pointer_with_notrack", "rucc::nocf_check_is_checked_and_kept_in_the_type_in_gcc_s_words"]
notes = "A function type without a landing pad under `-fcf-protection=branch` or `full`. A function of the type opens without `endbr64`, and a call or a tail jump through a pointer to one carries the `notrack` prefix, in the listing and in the object the compiler writes itself. It lands where `ms_abi` does: in the specifiers, after the declarator, beside the star of a pointer or in a typedef, one level down a pointer and no further. It is part of the type, as it is to gcc: a declaration each way is `conflicting types` and a pointer of one assigned to a pointer of the other is an incompatible pointer, spelled `void (__attribute__((nocf_check)) *)(void)`. On something that is not a function it is warned about and dropped, an argument is refused with `E0816`, and without `-fcf-protection` it is ignored with gcc's warning. A label whose address is taken keeps its pad. Written beside `cf_check` it wins, as in gcc."

[[feature]]
name = "indirect_return"
kind = "attribute"
gcc_version = "9.0"
status = "implemented"
targets = ["x86-64", "x86"]
used_by = ["glibc"]
tests = ["rucc-types::a_function_that_returns_by_a_jump_is_the_same_type", "rucc-ir::indirect_return_goes_on_a_call_and_nowhere_else", "rucc-codegen::a_call_that_comes_back_by_a_jump_stays_a_call_when_guarded", "rucc::a_call_that_can_come_back_by_a_jump_is_followed_by_a_landing_pad", "rucc::the_callee_s_own_type_counts_and_an_old_style_declaration_does_not", "rucc::full_keeps_a_tail_call_to_one_as_a_call", "rucc::the_attribute_is_checked_in_gcc_s_words", "rucc::the_object_has_the_pad_after_the_call"]
notes = "A function type whose function can come back by an indirect jump, as `swapcontext` does. Under `-fcf-protection=branch` or `full` each call to one is followed by `endbr64` or `endbr32`, whether it is called by name, through a pointer, a typedef or a member, in the listing and in the object the compiler writes itself, and `-mmanual-endbr` leaves the pads in. The callee's own declaration counts too, so a call through a plain pointer the optimizer saw the target of has its pad, while a declaration without a prototype has none, as in gcc. A call to `setjmp` or another `returns_twice` function gets the same pad, which gcc gives it and rucc did not before. A tail call to one stays a jump under `branch`, and under `full` it is a call with its pad unless the caller has the attribute too. It lands where `nocf_check` does, but it is not a difference between types: a declaration each way and a pointer of one taken for the other are said nothing about, and the composite keeps it. On something that is not a function it is warned about in gcc's words and dropped, and an argument is refused with `E0823`."

[[feature]]
name = "warn_if_not_aligned"
kind = "attribute"
gcc_version = "8.0"
status = "implemented"
used_by = ["linux"]
tests = ["rucc-types::what_a_member_asks_to_sit_at_comes_from_the_nearest_typedef_that_said", "rucc::a_member_that_asks_for_more_than_it_gets_is_warned_about_in_gcc_s_words", "rucc::the_warning_is_turned_off_and_made_an_error_by_its_own_name", "rucc::the_attribute_is_checked_in_gcc_s_words"]
notes = "The alignment a member of a type asks to sit at, checked under `-Wif-not-aligned`, which is on by default. A typedef, a tagged struct or union, an enumeration or a member's own declaration says it, a typedef of a typedef and an array of one ask what they name, and the nearest typedef that says its own number wins. Once a record is laid out, each member that asks is warned about, in gcc's words and order, where the record is aligned to less and again where the member sits at an offset that is not a multiple, so `struct { int i; __aligned_u64 x; }` is found where the kernel's uapi headers would be wrong on i386. A record inside it is asked only for what its own type says. Written bare it asks for the biggest alignment, as `aligned` does, zero is dropped with a warning, and another number that is not a power of two is refused. On an object or a function it is refused with `E0825`, on a bit-field or a bit-field of a type that carries it with `E0826`, and a second argument with `E0827`. One difference from gcc: on a parameter it is dropped without gcc's error. The warning points at the record where gcc sometimes points at the type of the member."

[[feature]]
name = "patchable_function_entry"
kind = "attribute"
gcc_version = "8.0"
status = "implemented"
used_by = ["linux"]
tests = ["rucc::the_attribute_takes_the_place_of_the_flag_for_one_function", "rucc::the_attribute_is_checked_in_gcc_s_words", "rucc-ir::the_room_a_function_asked_a_patcher_for_comes_back_as_written"]
notes = "The room one function opens with for a patcher, in place of what `-fpatchable-function-entry=` asks of every function: `N` instructions that do nothing, `M` of them in front of the label, recorded in `__patchable_function_entries` as the flag's are. `(0, 0)` takes the room away, which is the kernel's `notrace`. The last declaration to say it counts, the definition's or an earlier one's, and the second of two on one declaration over the first, as in gcc 13. It goes through the IR's text, so a module read back for the link keeps it. The wrong number of arguments is refused with `E0818`, an argument that is not a constant from 0 to 65535 drops it with gcc's warning, and an `M` larger than `N` is warned about and taken as 0. On a variable or a type it is dropped without a word, as gcc does, and on a target whose objects are not ELF it is dropped too."

[[feature]]
name = "cf_check"
kind = "attribute"
gcc_version = "8.0"
status = "implemented"
targets = ["x86-64", "x86"]
used_by = []
tests = ["rucc::cf_check_under_manual_endbr_is_the_only_function_with_a_landing_pad", "rucc::cf_check_is_checked_in_gcc_s_words"]
notes = "The function opens with a landing pad under `-fcf-protection=branch` and `-mmanual-endbr`, which leaves `endbr64` or `endbr32` out of every function that does not say `cf_check`, the ones whose address is taken included. The pads at labels whose address is taken stay either way, and `nocf_check` on the type wins over it. It is a declaration's attribute rather than the type's, merged across declarations as `noinline` is, so a prototype that says it covers a definition that does not and the other way round. Without `-mmanual-endbr` it changes nothing, and without `-fcf-protection` nothing is said. On a variable or a typedef it is warned about in gcc's words, and an argument is refused with `E0817`."

[[feature]]
name = "ifunc"
kind = "attribute"
gcc_version = "4.6"
status = "implemented"
used_by = ["glibc", "xz"]
tests = ["rucc::the_name_is_an_indirect_function_set_to_its_resolver", "rucc::ifunc_is_checked_in_gcc_s_words", "rucc::a_target_without_the_symbol_type_refuses_it"]
notes = "The function's own name is written as an indirect function, `.type f, @gnu_indirect_function` and `.set f,resolver`, global or local as the declaration is, and the dynamic linker binds a call to whatever the resolver hands back, the call through a pointer included. The resolver has to be defined in the same file, and a `static` one that nothing else calls is kept for it. One that does not return a pointer is refused and one that returns a pointer to another function type warned about under `-Wattribute-alias`, both in gcc's words, while `void *` is taken as it is. A body written for the function is a redefinition, and so is `alias` beside it on one declaration. The wrong number of arguments is refused with `E0819`, and on a variable, a typedef or a declaration in a block it is ignored with gcc's warning. Only ELF has the symbol type, so a COFF or Mach-O target refuses it."

[[feature]]
name = "symver"
kind = "attribute"
gcc_version = "10.0"
status = "implemented"
used_by = ["xz"]
tests = ["rucc::a_version_is_a_second_name_written_back_as_the_symver_gcc_writes", "rucc::the_object_has_each_versioned_name", "rucc::the_attribute_is_checked_in_gcc_s_words"]
notes = "`symver` with a string `name@node` on a function or a variable is a second name spelled with the version, at the same address and bound the same way, written as `.symver f, name@node` the way gcc writes it and put in the object's symbol table the way gas puts it. It is the same name a `.symver` in an `asm` makes. One declaration can ask for more than one, and an `alias` can ask for one, which is how a library keeps an old version beside the new. Only the first argument of one attribute counts, as in gcc. gcc's errors are given in its words, as `E0828` to `E0830`: the wrong number of arguments, an argument that is not a string or has no `@` or more than two, a version asked for twice, and a symbol that is not defined here, is common, is not public or does not have default visibility. A string that gas would refuse, such as one whose name starts with a digit, is refused at the attribute, where gcc leaves it to gas. On a member or a typedef it is ignored with gcc's warning, and so is an object in a frame. On a parameter it is ignored without one. Only ELF has symbol versions, so another object format refuses it, as gcc does. When the same version is asked for by a function and an object, the error is on the earlier declaration, where gcc puts it on the object."

[[feature]]
name = "fentry_name"
kind = "attribute"
gcc_version = "9.0"
status = "implemented"
targets = ["x86-64"]
used_by = ["linux"]
tests = ["rucc::a_function_can_name_its_own_hook_and_its_own_list", "rucc::the_last_name_said_is_the_one_taken", "rucc::the_names_are_checked_in_gcc_s_words", "rucc-driver::the_hook_and_its_list_can_be_named_on_x86_64"]
notes = "Under `-pg` the function's hook calls the name given in place of `__fentry__` or `mcount`, with either hook, and `-mfentry-name=` does the same for every function that did not say. The last name said wins, from a declaration after the definition as well. On anything but a function, or with an argument that is not a string, it is ignored with gcc's warning, and the wrong number of arguments is refused with `E0822`. An empty string is ignored with the warning too, where gcc writes a call to nothing. x86-64 only, as `-mrecord-mcount` is."

[[feature]]
name = "fentry_section"
kind = "attribute"
gcc_version = "9.0"
status = "implemented"
targets = ["x86-64"]
used_by = ["linux"]
tests = ["rucc::a_function_can_name_its_own_hook_and_its_own_list", "rucc::the_object_lists_the_call_in_the_section_named", "rucc::the_names_are_checked_in_gcc_s_words", "rucc-driver::the_hook_and_its_list_can_be_named_on_x86_64"]
notes = "The address of the function's hook is listed in the section named in place of `__mcount_loc`, in the listing and in the object, and it is listed whether or not `-mrecord-mcount` was given, as in gcc. `-mfentry-section=` names the section for every function that did not, and lists nothing without `-mrecord-mcount`. Under `-mnop-mcount` the nop is what is listed. Checked as `fentry_name` is."

[[feature]]
name = "warning"
kind = "attribute"
gcc_version = "4.3"
status = "implemented"
used_by = ["glibc", "linux"]
tests = ["rucc::a_warning_attribute_is_a_warning_and_the_listing_is_still_written", "rucc::both_attributes_are_said_and_the_latest_message_stands"]
notes = "A call still there once the optimizer is done is a warning quoting the message, and one it took out says nothing."

[[feature]]
name = "error"
kind = "attribute"
gcc_version = "4.3"
status = "implemented"
used_by = ["linux", "glibc"]
tests = ["rucc::a_build_bug_on_the_inliner_settles_true_is_an_error_quoting_the_message_at_the_call", "rucc::a_build_bug_on_the_inliner_settles_false_says_nothing", "rucc::a_call_in_code_that_was_taken_out_says_nothing", "rucc-driver::a_call_is_reported_only_in_a_function_the_program_can_reach"]
notes = "The kernel turns a link failure into a compile-time message with it, so it fires after optimization, on a call in a function the program can still reach, and a call the optimizer took out says nothing."

[[feature]]
name = "format"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["linux", "glibc", "systemd", "curl", "ffmpeg"]
tests = ["rucc-driver::format_takes_the_archetypes_gcc_knows_on_the_target", "rucc::the_format_checks_are_quiet_until_wall_or_wformat_asks_for_them", "rucc::a_printf_format_is_checked_against_its_arguments_in_gcc_s_words", "rucc::a_scanf_format_is_checked_against_the_pointers_it_writes_through", "rucc::a_format_attribute_and_format_arg_are_followed_the_way_gcc_follows_them"]
notes = "The archetype is checked against the ones gcc knows on the target, and a call to a function marked `printf`, `scanf` or `strftime`, or their `gnu_` names, has its literal format read against its promoted arguments under `-Wformat`, in gcc 16's words and under its four option names, as do the C library's own families without the attribute. Off until `-Wformat` or `-Wall`, as in gcc. The `ms_` archetypes, `strfmon` and what `-Wformat=2` adds are not read."

[[feature]]
name = "format_arg"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::the_hints_gcc_answers_yes_for_are_taken_without_a_word", "rucc::a_format_attribute_and_format_arg_are_followed_the_way_gcc_follows_them"]
notes = "Says the function returns a format string made from its argument, and the format check follows a call through it to the literal it was handed, which is how a translation from `gettext` is checked."

[[feature]]
name = "nonnull"
kind = "attribute"
gcc_version = "3.3"
status = "implemented"
used_by = ["glibc", "systemd", "postgres"]
tests = ["rucc-driver::nonnull_is_answered_yes_and_taken_with_or_without_operands"]
notes = "Taken with or without operands and nothing is assumed from it, which is always safe: a null check on a parameter it names stays where gcc would drop it, and `-Wnonnull` is not given for a null argument. glibc writes it on its declarations whatever `__has_attribute` says, and Postgres writes `pg_attribute_nonnull` only when it answers yes, so answering no made rucc's preprocessed Postgres differ from gcc's."

[[feature]]
name = "returns_nonnull"
kind = "attribute"
gcc_version = "4.9"
status = "implemented"
used_by = ["glibc", "systemd"]
tests = ["rucc::the_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Lets gcc drop a null check on what the function returns. Dropping the attribute keeps the check, which is always correct."

[[feature]]
name = "alloc_align"
kind = "attribute"
gcc_version = "4.9"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Says what the argument it names is the alignment of the pointer returned, which glibc writes on `aligned_alloc` and `memalign`. Lets gcc assume the alignment, and dropping it is always correct."

[[feature]]
name = "leaf"
kind = "attribute"
gcc_version = "4.6"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Promises that the function does not call back into the unit, which glibc's `__THROW` writes on nearly every function it declares. Lets gcc keep a static variable in a register across the call, and dropping it is always correct."

[[feature]]
name = "nothrow"
kind = "attribute"
gcc_version = "3.3"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Promises that the function throws no exception, which glibc's `__THROW` writes beside `leaf`. C has none to throw, and the unwind tables and `cleanup` landing pads are written as if any call might unwind, which is always correct."

[[feature]]
name = "artificial"
kind = "attribute"
gcc_version = "4.3"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Asks the debugger to treat an inlined body as the line it was called from, which gcc's intrinsic headers write on every intrinsic and glibc's `_FORTIFY_SOURCE` wrappers write on theirs. It changes only the debug information, which is still correct without it, with the inlined lines named as their own."

[[feature]]
name = "noplt"
kind = "attribute"
gcc_version = "6.0"
status = "implemented"
used_by = []
tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Asks that a call to the function go through the GOT rather than the PLT. The call through the PLT reaches the same function, so dropping it is always correct."

[[feature]]
name = "no_icf"
kind = "attribute"
gcc_version = "5.0"
status = "implemented"
used_by = []
tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Keeps a function from being folded into another identical one, and gcc 13 ignores it on an object with its `-Wattributes` warning. This compiler folds no two functions into one, so every function already keeps its own address."

[[feature]]
name = "warn_unused_result"
kind = "attribute"
gcc_version = "3.4"
status = "implemented"
used_by = ["linux", "glibc", "systemd"]
tests = ["rucc::a_result_thrown_away_is_said_the_way_gcc_says_it_for_each_attribute", "rucc::the_last_value_of_a_statement_expression_is_not_thrown_away_unless_the_whole_is"]
notes = "A call whose value an expression statement, the clauses of a `for` or the left side of a comma throws away is a warning in gcc's words under `-Wunused-result`, and a cast to `void` does not keep it quiet, which is gcc's rule. The last statement of a statement expression is its value and is not thrown away unless the statement expression is."

[[feature]]
name = "sentinel"
kind = "attribute"
gcc_version = "4.0"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::the_hints_gcc_answers_yes_for_are_taken_without_a_word", "rucc::a_call_without_its_sentinel_is_said_under_wall"]
notes = "A variadic call whose last argument, or the one `sentinel(n)` puts before it, is not a null pointer is said under `-Wformat`, as gcc files it, and so is one with too few variable arguments to hold it. `0` is not a null pointer here, since it is an `int`. `execl`, `execlp` and `execle` have it without the attribute, as in gcc."

[[feature]]
name = "access"
kind = "attribute"
gcc_version = "10.0"
status = "implemented"
used_by = ["glibc"]
tests = ["rucc::the_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Says how a function reads or writes through a pointer parameter, for gcc's warnings about out of bounds and uninitialized reads. None of them is given here and nothing is assumed from it, so taking it changes nothing a correct program does."

[[feature]]
name = "tainted_args"
kind = "attribute"
gcc_version = "12.0"
status = "implemented"
used_by = []
tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Asks `-fanalyzer` to treat the arguments as attacker controlled. This compiler has no analyzer, so there is nothing to tell."

[[feature]]
name = "fd_arg"
