[[feature]]
name = "nested_functions"
kind = "extension"
gcc_version = "2.0"
status = "implemented"
value = "0"
used_by = []
tests = ["rucc-sema::a_function_definition_inside_a_function_is_checked_and_called_by_name"]
notes = "GNU's nested functions, with the static chain in a register of its own and a trampoline made on the heap by libgcc the way gcc 14 and later make one under `-ftrampoline-impl=heap`, so the stack stays unexecutable. ELF targets on x86-64 and AArch64 only, and not under `-ffixed-x18`. A jump out of a nested function to a label of the function around it is refused. gcc 16 answers 0 for this name, as it does for every name it does not know, so `__has_extension` answers 0 here too although the thing itself works."

# Attributes, from section 13.4. `answer = \"error\"` marks the ones whose silent ignoring
# changes semantics rather than performance.

[[feature]]
name = "aligned"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
answer = "error"
used_by = ["linux", "glibc", "ffmpeg", "openssl"]
tests = ["rucc-driver::the_layout_attributes_move_the_members_and_the_record_the_way_gcc_lays_them_out", "rucc-driver::the_aligned_attribute_on_a_declaration_raises_what_that_one_object_is_aligned_to", "rucc-driver::what_a_declaration_asked_to_be_aligned_to_is_what_the_assembler_is_told", "rucc-driver::an_aligned_typedef_says_what_an_object_of_it_is_aligned_to_and_may_lower_it", "rucc-driver::an_access_through_a_typedef_that_lowered_its_alignment_says_the_one_the_typedef_asked_for", "rucc-driver::a_vector_read_through_a_typedef_that_lowered_its_alignment_comes_back_a_piece_at_a_time"]
notes = "Says what a record, a member, an object, a function or a typedef is aligned to. On the first four it only ever raises, and on a typedef gcc lets it lower as well, so an aligned(2) int really is at a multiple of two. A lowered one travels to the access as well as to the object, which is what makes a read through one of zstd's unalign typedefs a one byte aligned read of four bytes. It travels through a return as well, which is what makes _mm_loadu_si128 the unaligned load it is named for: the object comes back in registers and is read as aligned as it is rather than as aligned as its ABI class."

[[feature]]
name = "packed"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
answer = "error"
used_by = ["linux", "systemd", "curl"]
tests = ["rucc-driver::the_layout_attributes_move_the_members_and_the_record_the_way_gcc_lays_them_out"]
notes = "On a record and on one member of a record, in both the bare and the armoured spelling."

[[feature]]
name = "scalar_storage_order"
kind = "attribute"
gcc_version = "6.1"
status = "implemented"
answer = "error"
used_by = []
tests = ["rucc-driver::a_record_that_asks_for_the_other_byte_order_swaps_every_scalar_it_holds", "rucc-driver::a_bit_field_in_one_of_those_records_is_counted_from_the_top_of_its_bytes", "rucc-driver::the_address_of_a_scalar_stored_the_other_way_round_is_refused", "rucc-driver::a_storage_order_that_names_neither_end_is_refused_with_the_two_words_that_are_taken", "rucc::the_records_after_the_line_are_stored_in_its_order"]
notes = "Reverses the byte order of every scalar in a record, which is what a program reading a wire format or a disk image on the other endianness writes it for. The layout is untouched and only the numbering of the bits changes, from the bottom of the record's bytes to the top of them, so a scalar comes out byte swapped and a bit-field is counted from the other end of the bytes it lies in. Taking the address of one of those scalars is refused under E0712 the way gcc refuses it. A complex member, an address a relocation fills in and a copy between two records of different orders are reported as unsupported rather than written wrong. `#pragma scalar_storage_order` is the attribute on every record whose body closes after the line, and one that writes the attribute keeps its own."

[[feature]]
name = "section"
kind = "attribute"
gcc_version = "2.0"
status = "implemented"
answer = "error"
used_by = ["linux", "systemd"]
tests = ["rucc::an_elf_listing_puts_each_definition_in_the_section_it_named_with_gccs_flags", "rucc::an_elf_object_has_the_sections_gcc_writes_for_the_same_source", "rucc::a_darwin_listing_maps_an_elf_name_to_a_segment_and_a_section", "rucc::a_windows_listing_names_the_section_with_coff_flags", "rucc-asm::a_variable_in_a_named_section_is_there_with_the_flags_its_contents_ask_for", "rucc-object::a_named_section_carries_the_flags_of_what_is_in_it"]
notes = "The kernel's initcall and section placement machinery is built on it. A function goes in the named section as code and an object with the writability its contents ask for, zeros are bytes there unless the name is `.bss` or under it, and several definitions share one section in the order they were written. On Mach-O a name with no comma is given a segment, so `.mine` is `__DATA,__mine`."

[[feature]]
name = "no_sanitize"
kind = "attribute"
gcc_version = "4.8"
status = "implemented"
used_by = ["linux"]
tests = ["tests/accept/attributes-that-ask-for-nothing-this-compiler-does.c"]
notes = "Says a function is to be left out of the instrumentation the sanitizers named ask for. This compiler refuses `-fsanitize=` for every sanitizer, so nothing is ever instrumented and the promise is kept by doing nothing. When a sanitizer is taken this has to be read."

[[feature]]
