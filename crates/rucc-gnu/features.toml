tests = ["rucc::the_promises_and_the_tool_hints_gcc_answers_yes_for_are_taken_without_a_word"]
notes = "Tells `-fanalyzer` the argument is an open file descriptor. This compiler has no analyzer, so there is nothing to tell."

[[feature]]
