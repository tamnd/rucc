notes = "The other half of `ms_struct`, and answered on the same targets."

[[feature]]
name = "dllimport"
kind = "attribute"
gcc_version = "3.1"
status = "implemented"
targets = ["windows"]
used_by = ["mingw-w64"]
tests = ["rucc-sema::dllimport_and_dllexport_written_as_attributes_are_kept", "rucc::a_call_to_a_dllimport_function_goes_through_its_import_pointer", "rucc-pp::the_answers_for_the_x86_and_windows_attributes_are_the_targets"]
notes = "Read on every target, as gcc and clang read it, and acted on only in a COFF object. `__has_attribute` answers yes only on Windows, which is where gcc has it, since an ELF or Mach-O target has no DLLs to import from."

[[feature]]
name = "dllexport"
