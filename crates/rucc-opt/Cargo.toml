[package]
name = "rucc-opt"
description = "The pass manager, the acyclic e-graph, the rewrite rules and the analyses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

# All of lower rank than 9, per spec/18-package-layout.md section 18.2. `rucc-session` is here
# for the optimization level and nothing else, since the level is what selects a pipeline.
# `rucc-cost` is where every threshold a pass consults has to come from, per section 40.12, and
# this crate is its first caller. `rucc-abi` is for the one pass that has to know the calling
# convention, which is the inliner forwarding the anonymous arguments of a call, and it asks which
# description the target's registers point at rather than which machine it is. `rucc-target` is
# for that link, for the set of x86-64 extensions the inliner compares a caller and a callee by,
# and for what the switch conversion may put in a table.
[dependencies]
rucc-abi = { workspace = true }
rucc-base = { workspace = true }
rucc-cost = { workspace = true }
rucc-ir = { workspace = true }
# For the spans `coverage` keeps of every block it counts, which the driver turns into the lines of
# the `.gcno` file.
rucc-diag = { workspace = true }
rucc-session = { workspace = true }
rucc-target = { workspace = true }

# The rule compiler, which turns `rules/*.rules` into the table `src/rules` includes. A build
# dependency and never an ordinary one, per spec/18-package-layout.md section 18.2: it is build
# tooling, it is outside the layer stack, and nothing it holds is in the compiler that ships.
[build-dependencies]
rucc-rules = { workspace = true }
