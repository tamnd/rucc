[package]
name = "rucc-opt"
description = "The pass manager, the acyclic e-graph, the rewrite rules and the analyses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

# All of lower rank than 9, per spec/18-package-layout.md section 18.2. `rucc-session` is here
# for the optimization level and nothing else, since the level is what selects a pipeline.
[dependencies]
rucc-base = { workspace = true }
rucc-ir = { workspace = true }
rucc-session = { workspace = true }

# The target is only needed to build a module to run a pass over.
[dev-dependencies]
rucc-target = { workspace = true }
