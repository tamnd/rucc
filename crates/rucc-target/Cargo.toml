[package]
name = "rucc-target"
description = "Target descriptions, register files and ABI data for the rucc C compiler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

# Layer rank 2. Every entry below must be of strictly lower rank, which is what
# `cargo xtask layers` checks on every commit. `rucc-base` is rank 0 and is here for the
# floating point formats, since which one `long double` is is a fact about the target.
#
# `rucc-abi` and `rucc-tuple` are rank 1 and they are why this crate moved up from rank 1 to
# rank 2. The sizes and the signedness of the standard types used to be written out here as a
# match on the architecture and the operating system, and they are stated once in
# `rucc_abi::DataLayout` over the ten field tuple, which covers fourteen architectures rather
# than three and is checked against a reference compiler.
[dependencies]
rucc-abi.workspace = true
rucc-base.workspace = true
rucc-tuple.workspace = true
