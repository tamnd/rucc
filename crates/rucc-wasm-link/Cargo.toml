# Layer rank 0, and it depends on nothing. A linker reads bytes and writes bytes, and the object
# format it reads is the one the tool conventions define, not one of rucc's types, so it needs no
# crate of this workspace. Rank 0 also keeps it out of the way of the crates that will call it.
