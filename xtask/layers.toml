# The layer ranks, per spec/18-package-layout.md section 18.2.
#
# A crate may depend only on crates of a strictly lower rank. Two crates that share a rank
# cannot depend on each other in either direction, so a rank is a set of crates that could be
# built in parallel and reviewed independently.
#
# Ranks are assigned rather than derived. Adding a dependency the current ranks forbid is a
# design change, and it should show up in review as an edit to this file rather than as one
# more line in a Cargo.toml that nobody reads.
#
# `cargo xtask layers` reads this and checks it against the real dependency graph. It is a
# required CI job, because a layering convention that is not mechanically checked is a
# layering convention that held for six months.

[ranks]
# Foundations. Nothing below rucc-base, which is why it must stay free of anything C-specific.
# rucc-tuple sits beside it for the same reason: a target tuple is a fact about a machine and
# there is nothing about C in it.
rucc-base = 0
rucc-tuple = 0
rucc-diag = 1
# rucc-abi describes what a target's types look like and how its calls are made, over the ten
# field tuple and nothing else. It was beside rucc-target for as long as neither depended on the
# other, and rucc-target now reads its layout facts from here, so it sits below and everything
# from rucc-target upward moved one rank. That renumbering is the visible half of the migration
# and it is why this file exists.
rucc-abi = 1
# rucc-sysroot is beside it for the same reason. Where a target's headers are and what order its
# link inputs go in is a fact about the target, and answering it needs the tuple and nothing
# else. It reads no environment variable and touches no file, which is what keeps it here rather
# than up beside the driver.
rucc-sysroot = 1
# rucc-stub is beside them, which is where spec/cross-compile/09-libc-stubs.md section 9.8 puts it.
# It writes its own ELF rather than reaching for rucc-object at rank 9, and that is not a
# duplication worth removing: a stub has no code, no relocations and no sections to lay out around
# code, so the writer it wants is a much smaller program, and sharing one would point this edge of
# the graph backwards.
rucc-stub = 1
rucc-target = 2
rucc-cost = 3
rucc-types = 3
rucc-session = 4

# The frontend. rucc-gnu sits below the lexer because the __has_* family is answered during
# preprocessing, and rucc-pp above the lexer because expansion consumes pp-tokens.
rucc-gnu = 5
rucc-lex = 5
rucc-pp = 6
rucc-ast = 7
rucc-parse = 8
rucc-sema = 8

# The IR. rucc-ir is pure: it knows the target and nothing about C. That is only true because
# rucc-lower exists to hold the walk that needs both.
rucc-ir = 9
rucc-object = 9
rucc-lower = 10
rucc-opt = 10

# The safety monitor. Rank 10 alongside rucc-lower and rucc-opt, and therefore unable to depend on
# either of them, which is the point: it consumes IR and produces IR and never sees the AST. The
# driver at rank 13 is what sequences it between the two. Design: spec/safe-memory/15-integration.md
# section 15.1.
rucc-safety = 10

# The backend. rucc-asm is above rucc-mir rather than beside it, because what it writes out is a
# machine function and there is no lower place a machine function could be described.
rucc-mir = 10
rucc-debug = 10
rucc-asm = 11
rucc-lto = 11
rucc-regalloc = 11
rucc-codegen = 12

# The top. Only these two know that a process, a file system and a command line exist.
rucc-driver = 13
rucc = 14

# Outside the stack entirely. Build tooling and the target-side runtime, neither of which is
# linked into the compiler, so the rank rule does not apply to them.
[outside]
crates = ["xtask", "rucc-rules", "rucc-targets", "rucc-verify", "rucc-builtins", "rucc-safe-rt"]
